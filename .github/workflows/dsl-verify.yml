# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# 策略 DSL 一致性校验：.adl 契约源 → 生成的纯 C 决策表，零漂移（SSoT gate）
# ===========================================================================
# Authority: docs/docs-linux/30-interfaces/06-codegen-pipeline.md §7.2 / §9.3
# Design: K-1 机制/策略分离——策略由 .adl 编译为决策表（tools/dsl）
#         IRON-9（生成产物禁止手工修改，CI 强制零漂移）
# ---------------------------------------------------------------------------
# 说明：tools/dsl 复用 tools/codegen 的确定性渲染环境与共享类型
# （codegen_io.make_env / codegen_types），二者存在单向依赖。故本 workflow
# 同时监听 tools/codegen/**，一旦 codegen 侧改动破坏 DSL 校验即可被捕获。
# 零漂移判定沿用 dsl_compile.py --check（内容比对），与 codegen-verify 一致。
# ===========================================================================

name: dsl-verify
on:
  pull_request:
    paths:
      - 'tools/dsl/**'
      - 'tools/codegen/**'
  push:
    branches: [main, develop]
    paths:
      - 'tools/dsl/**'
      - 'tools/codegen/**'

# 最小权限：本 workflow 全程只读，显式声明后不再依赖仓库默认设置。
permissions:
  contents: read

# 同一 ref 只保留最新一轮：新 push 让旧 run 的结论对当前树失效，
# 继续排队只会抢并发额度，并让排障读到旧 run 的日志。
concurrency:
  group: dsl-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsl-verify:
    name: DSL SSoT Drift Check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DSL dependencies and verify zero drift (IRON-9)
        run: ci/ci.sh python-verify --kind dsl
