# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# 管理仓编排 CI（2 jobs：文件完整性 + 子仓编排）
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
# Design: 管理仓只做必要验证（SSoT/file-integrity/submodule-orchestration）
#         语言级 CI 下沉到各叶子子仓 .github/workflows/
# ===========================================================================

name: mgmt-verify
on:
  pull_request:
    paths:
      - '**.md'
      - '.gitmodules'
      - 'ssot-registry.yaml'
      - 'MAINTAINERS'
      - 'CODEOWNERS'
      - 'tools/**'
      - '.github/**'
  push:
    branches: [main]
    # push 与 pull_request 用同一份判据，并额外列出 9 个子仓的 path：
    # gitlink 变更在 diff 里就是子仓目录本身，不列出就会漏掉依赖升级这一
    # 最需要重跑叶子仓编排的场景。
    paths:
      - '**.md'
      - '.gitmodules'
      - 'ssot-registry.yaml'
      - 'MAINTAINERS'
      - 'CODEOWNERS'
      - 'tools/**'
      - '.github/**'
      - 'kernel'
      - 'memory'
      - 'security'
      - 'cognition'
      - 'services'
      - 'system'
      - 'cloudnative'
      - 'tests-linux'
      - 'distro'

jobs:
  # ─── Job 1: 治理文件完整性 ─────────────────────────────────────────
  # 合并原 file-integrity + submodule-status 两个 job
  file-integrity:
    name: Governance File & Submodule Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # 五项断言都只读工作树，判据与本地一致，故统一由 ci/gates 承载
      - name: Governance file & submodule integrity
        run: ci/ci.sh mgmt-files

  # ─── Job 2: 子仓 CI 编排 ────────────────────────────────────────────
  # 合并原 subrepo-status + doc-format 两个 job
  orchestrate-leaf-ci:
    name: Orchestrate Leaf Submodule CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: file-integrity
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # 叶子仓未全部接入 CI 时其状态为 unknown，仅告警；red 才阻断。
      # markdownlint 只扫本仓自有 .md，版权头同轮校验——三项同属「编排与
      # 文档」判据，合成一个 gate 以免同一份工作重复执行。
      - name: Orchestrate leaves & docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh mgmt-leaves
