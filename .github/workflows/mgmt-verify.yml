# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# 管理仓编排 CI（2 jobs：文件完整性 + 子仓编排）
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
# Design: 管理仓只做必要验证（SSoT/file-integrity/submodule-orchestration）
#         语言级 CI 下沉到各叶子子仓 .github/workflows/
# ===========================================================================

name: mgmt-verify
on:
  pull_request:
    # [SC] 共享契约头文件随 kernel gitlink 一起升级，而 gitlink 在 diff 里
    # 只呈现为 `kernel` 一项，故 PR 侧必须列出它，否则 12 头与副本唯一性
    # 在评审阶段静默漏检。
    paths:
      - '**.md'
      - '.gitmodules'
      - 'ssot-registry.yaml'
      - 'MAINTAINERS'
      - 'CODEOWNERS'
      - 'tools/**'
      - '.github/**'
      - 'kernel'
      # 本 workflow 的两个 job 由 ci/gates/mgmt-*.sh 承担：改门禁自身必须
      # 先过 PR，否则「校验者不受校验」。
      - 'ci/gates/mgmt-*.sh'
      - 'ci/lib/**'
  push:
    branches: [main]
    # push 侧在 PR 判据之外再列出 8 个子仓 path：gitlink 变更在 diff 里就是
    # 子仓目录本身，不列出就会漏掉依赖升级这一最需要重跑叶子仓编排的场景；
    # PR 侧只列 kernel，因为它是唯一携带 [SC] 契约的子仓。
    paths:
      - '**.md'
      - '.gitmodules'
      - 'ssot-registry.yaml'
      - 'MAINTAINERS'
      - 'CODEOWNERS'
      - 'tools/**'
      - '.github/**'
      - 'kernel'
      # 本 workflow 的两个 job 由 ci/gates/mgmt-*.sh 承担：改门禁自身必须
      # 先过 PR，否则「校验者不受校验」。
      - 'ci/gates/mgmt-*.sh'
      - 'ci/lib/**'
      - 'memory'
      - 'security'
      - 'cognition'
      - 'services'
      - 'system'
      - 'cloudnative'
      - 'tests-linux'
      - 'distro'

# 最小权限：文件完整性与叶子仓编排都只读；叶子仓 CI 状态由 token 只读查询。
permissions:
  contents: read
  actions: read

# 同一 ref 只保留最新一轮：新 push 让旧 run 的结论对当前树失效，
# 继续排队只会抢并发额度，并让排障读到旧 run 的日志。
concurrency:
  group: mgmt-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: 治理文件完整性 ─────────────────────────────────────────
  # 合并原 file-integrity + submodule-status 两个 job
  file-integrity:
    name: Governance File & Submodule Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # 五项断言都只读工作树，判据与本地一致，故统一由 ci/gates 承载
      - name: Governance file & submodule integrity
        run: ci/ci.sh mgmt-files

  # ─── Job 2: 子仓 CI 编排 ────────────────────────────────────────────
  # 合并原 subrepo-status + doc-format 两个 job
  orchestrate-leaf-ci:
    name: Orchestrate Leaf Submodule CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: file-integrity
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # 叶子仓未全部接入 CI 时其状态为 unknown，仅告警；red 才阻断。
      # markdownlint 只扫本仓自有 .md，版权头同轮校验——三项同属「编排与
      # 文档」判据，合成一个 gate 以免同一份工作重复执行。
      - name: Orchestrate leaves & docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh mgmt-leaves
