# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# QEMU 测试农场：单元测试与端到端契约校验
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md §5.3
# Rules: OS-TEST-010/013~022（QEMU 运行 kselftest 与 TAP 门禁）
# ---------------------------------------------------------------------------
# 说明：tools/airy-qemu 把 kselftest 的执行、取证、TAP 聚合与门禁判定
# 拆成十二个分片，任一模块或清单改动都可能破坏农场契约。本 workflow
# 独立运行该工具的 pytest 套件（含端到端流水线与 CI/文档契约测试），
# 不依赖宿主 KVM 或真实 QEMU：执行器在测试中被假实现替代，验证的是
# 流水线编排与判定语义，而非虚拟化硬件。
#
# 真实 QEMU 上的 kselftest 运行仍由 kernel-verify 的 virtme-ng 链路承担；
# 本 workflow 只保证农场工具自身可复现、可回归。
# ===========================================================================

name: farm-verify
on:
  pull_request:
    paths:
      - 'tools/airy-qemu/**'
      - '.github/workflows/farm-verify.yml'
  push:
    branches: [main, develop]
    paths:
      - 'tools/airy-qemu/**'
      - '.github/workflows/farm-verify.yml'

# 最小权限：本 workflow 全程只读，显式声明后不再依赖仓库默认设置。
permissions:
  contents: read

# 同一 ref 只保留最新一轮：新 push 让旧 run 的结论对当前树失效，
# 继续排队只会抢并发额度，并让排障读到旧 run 的日志。
concurrency:
  group: farm-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  farm-verify:
    name: QEMU Farm Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install farm dependencies and run tests
        run: ci/ci.sh python-verify --kind farm
