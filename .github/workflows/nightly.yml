# ===========================================================================
# AirymaxOS nightly pipeline
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
#            docs/docs-linux/120-development-process/08-ci-cd-pipeline.md
# Contract:  tools/nightly/manifest.yaml   （结构、预算与 helper 契约的 SSoT）
# Gate:      python3 tools/nightly/nightly.py --check
#
# 约束：
#   * nightly 结果不阻断 PR（§6.1），因此禁止 pull_request / push 触发。
#   * 全局单实例：同一时刻只允许一次 nightly；不取消进行中的运行（§9.2）。
#   * 托管 runner 单 job 硬上限 6 小时，超时预算不得超过 360 分钟。
#   * formal-verify / soak-runner / chaos-runner / auto-bisect /
#     create-revert-pr / ci-budget-check 尚未落地，清单登记为 deferred；
#     helper 的存在性守卫与调用参数收在 ci/gates/nightly-helpers.sh，
#     本文件只保留 `ci/ci.sh nightly-helpers <key>` 一行，逻辑可在本地重放。
# ===========================================================================

name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─── Job 1: 契约自校验 + 每夜测试套件 ──────────────────────────────
  nightly-test-suite:
    name: Nightly Test Suite (Formal + Soak + Chaos)
    runs-on: ubuntu-24.04
    timeout-minutes: 360   # 托管 runner 单 job 硬上限（6 小时）
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Validate nightly contract
        run: python3 -m pip install --quiet pyyaml && python3 tools/nightly/nightly.py --check

      - name: Formal verification (seL4-style)
        run: ci/ci.sh nightly-helpers formal-verify

      - name: 72h soak test (memory leak / refcount drift)
        run: ci/ci.sh nightly-helpers soak-runner

      - name: Chaos injection (hotplug / hotremove / I/O / net partition)
        run: ci/ci.sh nightly-helpers chaos-runner

  # ─── Job 2: 回滚或预算检查 ─────────────────────────────────────────
  nightly-revert-or-budget:
    name: Auto-Revert or CI Budget Check
    runs-on: ubuntu-24.04
    needs: nightly-test-suite
    if: always()
    timeout-minutes: 30
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Auto-bisect regression window (if nightly-test-suite failed)
        if: needs.nightly-test-suite.result == 'failure'
        run: ci/ci.sh nightly-helpers auto-bisect

      - name: Open revert PR for the regression commit
        if: needs.nightly-test-suite.result == 'failure'
        run: ci/ci.sh nightly-helpers create-revert-pr "$COMMIT"

      - name: Check CI total budget (60min gate, OS-STD-TEST-011)
        if: always()
        run: ci/ci.sh nightly-helpers ci-budget-check
