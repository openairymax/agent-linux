# ===========================================================================
# AirymaxOS release pipeline（L7 发布验证）
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
#            docs/docs-linux/120-development-process/09-release-process.md
# Constraint: 管理仓每个 workflow 最多 2 条流水线
#
# 全部逻辑在 ci/gates/release-*.sh，本文件只保留 checkout → ci/ci.sh <gate>
# → upload。任一步都能在本地对着同一份物料重放，不必重跑整条流水线。
# ===========================================================================

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'          # 稳定版 v0.0.3
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+' # 候选版 v0.0.3-rc1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (如 v0.0.3)'
        required: true
      publish_run:
        description: '只发布该 run 的 build-and-sign 制品（首个版本建页前用）'
        type: string
        default: ''

concurrency:
  # 一个 tag 只能有一条发布流水线。tag 重指（收回错误的发布提交）时
  # 必须让新 run 顶掉旧 run，否则两轮 build-and-sign 会并发写同一个
  # Release（0.0.3 收尾期出现过 40206825830 与 40207819634 并行）。
  # 与 image-build 的 cancel-in-progress: false 相反：ISO 组装宁排队不中断，
  # 发布则以最新 tag 指向为准。
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 发布 tag 的唯一来源：tag 推送事件取 ref_name，手动触发取 inputs.tag
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # OCI 镜像名（SSoT: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md §8.4/§8.5）
  OCI_IMAGE: ghcr.io/openairymax/airymaxos

jobs:
  build-and-sign:
    name: Build + SBOM + Sign (L7)
    runs-on: ubuntu-24.04
    # 发布只重放已有制品时跳过整段构建：制品字节由 build-and-sign 一次产出并
    # 带摘要，重放与重构建是两件事，前者不产生任何新字节。
    if: inputs.publish_run == ''
    # job 预算必须罩住「前置依赖安装 + 内核四腿 + 签名上传」三段之和，
    # 且每段都要留出与其方差相称的余量。实测：前置 checkout/apt 5.3min
    # （慢源上出现过 18min），内核四腿 209.8min，签名与上传约 20min。
    # 取 360min（GitHub 托管 runner 硬上限）：四腿按 270min 封顶时，
    # 28+270+20=318min，仍有 42min 富余。
    timeout-minutes: 360
    # 步骤顺序按「失败代价递增」排列：静态门禁（秒）→ 版本与签名密钥自检
    # （秒）→ 依赖安装与 SBOM/SDK（分钟）→ 内核四腿（小时）→ 签名与上传。
    # 代价大的步骤排在不具依赖关系的廉价步骤之后，任何输入错误都在最便宜
    # 的一步暴露，而不是在两小时后。
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 手动触发时 github.ref 是默认分支，不指定 ref 会拿分支头顶着
          # 某个 tag 的版本号去构建：tag 指向的提交与产物不再对应，事后
          # 无法用 tag 复现这次发布。tag 推送事件下两者等值，写成显式
          # ref 对两种入口都成立。
          ref: ${{ env.RELEASE_TAG }}
          # 全量历史保证 SOURCE_DATE_EPOCH 可取到确定性提交时间（§3.7）；
          # 递归子模块供 SBOM 扫描与内核构建使用。
          fetch-depth: 0
          submodules: recursive

      # 发布比组装更不允许「源码只在本机」：tag 一侧推了、另一侧没推，
      # 产物照样签得出来，但取不到对应源码的发行版没有意义（CI-07）。
      # 比的是 tag 与检出提交，手动触发与 tag 推送两种入口因此同判据。
      - name: Origin tag check
        run: ci/ci.sh remote-sync --kind tags --ref "$RELEASE_TAG" --sha "$(git rev-parse HEAD)" --remote origin

      # 与 image-build 同一条静态门禁：发布链此前全程无 lint，静态不合格
      # 的树可以直接进到四架构内核构建与签名（0.0.4 清单 CI-06）。
      - name: Static gates
        run: ci/ci.sh distro-lint

      # 归一化、格式校验与 tag/ver 输出都在 gate 里，后续步骤只读输出。
      - name: Derive release version
        id: ver
        run: ci/ci.sh release-version --tag "${RELEASE_TAG}"

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # 私钥缺席或口令错误时，此前要跑满内核四腿（210 分钟）＋SDK＋OCI
      # 才在签名步暴露。probe 在任何长步骤之前做一次真实签名自检。
      - name: Verify GPG signing capability
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ci/ci.sh release-sign probe

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Compute SOURCE_DATE_EPOCH
        id: epoch
        run: echo "value=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      # SDK 与烧录工具同出一门：打包、确定性比对、pyz 实跑自检都在 gate 里。
      # 它只依赖源码与 SOURCE_DATE_EPOCH，与后面所有安装、编译步骤无关，
      # 因此紧跟 epoch：pyz 自检失败时只花几秒，而不是在 60 分钟依赖安装
      # 与 210 分钟内核四腿之后才暴露——0.0.3 发布页上那份与 tag 不同源的
      # pyz 正是这类「最后一步才发现」的产物。
      - name: Pack SDK and airy-flash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh tool-pack --out . --version "${{ steps.ver.outputs.ver }}"

      - name: Generate + merge SPDX SBOM
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh release-sbom --ver "${{ steps.ver.outputs.ver }}"

      # 物料 6（09-release-process.md §3.5）：内核配置快照。只读源码、不编译，
      # 与 SDK 一样放在最便宜的一段——四架构片段缺一腿或选型配置被改坏，
      # 都该在几分钟内暴露，而不是等内核四腿跑完。
      - name: Snapshot airy_defconfig
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh release-config snapshot --ver "${{ steps.ver.outputs.ver }}"

      # 物料 1（09-release-process.md §3.2）：源码 tarball。与配置快照同理放在
      # 最便宜的一段——子仓未初始化、tag 与 gitlink 不一致等问题几分钟内暴露，
      # 不必等内核四腿跑完。导出 1.4 GB 内核源码再压到约 200 MB，实测数分钟。
      - name: Pack source tarball
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh release-source snapshot --ver "${{ steps.ver.outputs.ver }}"

      # 物料 12（§3.1，铁律 OS-IRON-001）：syscall ABI 报告。判定由
      # tools/abi-check 做，门禁只做「跑一次真实检查 + 钉溯源 + 失败不出
      # 报告」。它只读源码，秒级完成，故与配置快照、源码 tarball 同段。
      - name: Generate syscall ABI report
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh release-abi report --ver "${{ steps.ver.outputs.ver }}"

      # 同一段安装在暖缓存 runner 上 33s 完成，冷启动 28min，也出现过整步
      # 卡住 45min 以上的实例：镜像源无响应时 apt 没有超时，会把 240min 的
      # job 预算烧光。acquire 超时、重试与硬超时统一收在 ci/lib/apt.sh，
      # 本步只需封顶，让镜像故障表现为一次可重试的失败。
      - name: Install kernel build dependencies and cross toolchains
        timeout-minutes: 60
        run: ci/ci.sh release-deps

      # 4 架构内核 RPM：单 job 内顺序构建（管理仓 2 job 铁律，不得引入
      # matrix job）。实测 x86_64 60.6min、aarch64 57.5min、riscv64 16.7min、
      # loongarch64 75min，合计 209.8min。旧封顶取 210min，只比实测多 12 秒：
      # 这不是余量，是把一次 3.5 小时的发布会话押在「今天不比上次慢」上，
      # 任何一腿抖动一次就整轮作废（四腿同 job，前三腿的产物一起丢）。
      # 故按「实测 + 约 29% 方差余量」取 270min，仍在 job 的 360min 之内。
      - name: Build kernel RPM (4 architectures)
        timeout-minutes: 270
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh release-kernel build

      - name: Verify kernel RPM matrix
        run: ci/ci.sh release-kernel matrix

      - name: Build OCI base image
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh release-oci build --tag "${{ steps.ver.outputs.tag }}" --ver "${{ steps.ver.outputs.ver }}"

      - name: Sign release artifacts (GPG)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ci/ci.sh release-sign artifacts --ver "${{ steps.ver.outputs.ver }}"

      # 公钥是验证链的锚：发布页给了 .asc 却拿不出对应公钥，取件方就只能
      # 信「这里有个签名」，无法验。私钥随 runner 销毁，公钥必须在签名之后、
      # 生成摘要清单之前导出，才会进清单，进而被对账与发布页收录。
      - name: Export the release public key
        run: ci/ci.sh release-sign key --ver "${{ steps.ver.outputs.ver }}"

      # 物料 8/9（09-release-process.md §3.1）：以 tools/release-engineering
      # 的确定性实现产出校验和文件与精简 release notes，并即时 GPG 签名。
      # 命名规则：发布资产用 agent-linux-<ver>（§3.2），RPM 包名用 airymaxos-*（§3.3）。
      - name: Generate + sign checksums and release notes
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ci/ci.sh release-sign manifest --ver "${{ steps.ver.outputs.ver }}" --tag "${{ steps.ver.outputs.tag }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-${{ steps.ver.outputs.ver }}
          if-no-files-found: error
          path: |
            dist/rpm/**/*.rpm
            dist/rpm/**/*.rpm.asc
            sbom-agent-linux-${{ steps.ver.outputs.ver }}.spdx.json
            agent-linux-sdk-${{ steps.ver.outputs.ver }}.tar.gz
            agent-linux-sdk-${{ steps.ver.outputs.ver }}.tar.gz.asc
            airy-flash-${{ steps.ver.outputs.ver }}.pyz
            airy-flash-${{ steps.ver.outputs.ver }}.pyz.asc
            agent-linux-${{ steps.ver.outputs.ver }}-airy-defconfig.tar.xz
            agent-linux-${{ steps.ver.outputs.ver }}-airy-defconfig.tar.xz.asc
            agent-linux-${{ steps.ver.outputs.ver }}.tar.xz
            agent-linux-${{ steps.ver.outputs.ver }}.tar.xz.asc
            agent-linux-${{ steps.ver.outputs.ver }}-abi-report.md
            agent-linux-${{ steps.ver.outputs.ver }}-abi-report.md.asc
            agent-linux-${{ steps.ver.outputs.ver }}-gpg-key.asc
            oci-image-${{ steps.ver.outputs.tag }}.tar
            agent-linux-${{ steps.ver.outputs.ver }}.sha256sum
            agent-linux-${{ steps.ver.outputs.ver }}.sha256sum.asc
            agent-linux-${{ steps.ver.outputs.ver }}-release-notes.md
            agent-linux-${{ steps.ver.outputs.ver }}-release-notes.md.asc

  publish-release:
    name: Publish + GitHub Release (L7)
    runs-on: ubuntu-24.04
    # 上传制品与写 Release 都是短操作，60 分钟足够；不给默认 360 分钟。
    timeout-minutes: 60
    needs: build-and-sign
    # build-and-sign 被跳过时（只重放制品）needs 结果为 skipped，仍须继续。
    if: ${{ always() && (inputs.publish_run != '' || needs.build-and-sign.result == 'success') }}
    permissions:
      contents: write
      packages: write
      # 重放时从指定 run 取制品，读他人 run 的制品需要 actions: read。
      actions: read
    env:
      # -rc/-beta 后缀才是预发布。正式 tag 也不在这里成为 latest：页面建好
      # 先停在 held，由发布机在 B 轮 AIRYMAX-SMOKE-PASS 之后显式 promote。
      # releases/latest 是更新通道入口，一建页就置 latest 等于把未验收的
      # 构建推给所有装机（REL-02）。
      PUBLISH_RUN: ${{ inputs.publish_run }}
    steps:
      # 发布侧同样按 tag 检出：release-verify 读的是 ci/ 与模板，
      # 用默认分支的版本去校验 tag 的产物，等于换了判据。
      # 递归子模块是硬要求：channel-fetch 要做客户端校验包比对，
      # 读的是 system 子模块里的 system/services/airyupdate；
      # 不拉子模块时该路径为空，发布在写 Release 前直接失败。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      # tag 与 ver 在重放路径下没有上游输出可用，统一由 RELEASE_TAG 推出，
      # 两条路径共用同一份判定。判定本身在门禁里：内联 shell 只能在云端
      # 验一次，且与 build-and-sign 的取版本逻辑会各演化一套。
      - name: Resolve release metadata
        id: meta
        run: ci/ci.sh release-version --tag "${RELEASE_TAG}"

      # 两条路径分别成步：download-artifact 只有在指定 run-id 时才应带令牌，
      # 同一组 with 兼顾两义会让「取本轮制品」也走跨轮校验，凭空多一个失败面。
      - name: Download build artifacts
        if: env.PUBLISH_RUN == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts-${{ steps.meta.outputs.ver }}

      - name: Download build artifacts (replay)
        if: env.PUBLISH_RUN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts-${{ steps.meta.outputs.ver }}
          run-id: ${{ env.PUBLISH_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 发布前自证：签名发生在另一台 runner，落盘字节可能已被 artifact
      # 打包解包改写。摘要、署名与 notes 形态在这一步重算，失败即停止，
      # 不进入 registry 与 Release。
      - name: Verify signed artifacts
        run: ci/ci.sh release-verify --dir .

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Publish OCI image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh release-oci publish --tag "${{ steps.meta.outputs.tag }}"

      # 通道清单只能来自装配出 ISO 的那一轮：它是客户端发现新版本的唯一入口
      # （releases/latest/download/channel.json），在本机重新生成等于用当前源码
      # 再推一份声明，与线上字节无关。取不到就不发版——发布页没有清单，装了
      # 这套系统的人就永远收不到后续版本。预发布不进更新通道，也没有清单。
      - name: Fetch release channel manifest
        if: steps.meta.outputs.pre_rel == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh channel-fetch --tag "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}" --dir .

      # 同一个 tag 重发时，旧号 RPM（airymaxos-kernel-*-0.0.3-5.*）会与本次的
      # 新号包并排留在发布页上——glob 上传只增不删。写 Release 之前按摘要清单
      # 把页面收回本次物料。
      - name: Prune stale release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh release-prune --tag "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.pre_rel }}
          make_latest: false
          # release notes 由确定性生成器产出并 GPG 签名，不再使用自动生成
          body_path: agent-linux-${{ steps.meta.outputs.ver }}-release-notes.md
          files: |
            dist/rpm/**/*.rpm
            dist/rpm/**/*.rpm.asc
            agent-linux-sdk-*.tar.gz
            agent-linux-sdk-*.tar.gz.asc
            airy-flash-*.pyz
            airy-flash-*.pyz.asc
            agent-linux-${{ steps.meta.outputs.ver }}-airy-defconfig.tar.xz
            agent-linux-${{ steps.meta.outputs.ver }}-airy-defconfig.tar.xz.asc
            agent-linux-${{ steps.meta.outputs.ver }}.tar.xz
            agent-linux-${{ steps.meta.outputs.ver }}.tar.xz.asc
            agent-linux-${{ steps.meta.outputs.ver }}-abi-report.md
            agent-linux-${{ steps.meta.outputs.ver }}-abi-report.md.asc
            sbom-agent-linux-*.spdx.json
            agent-linux-*-gpg-key.asc
            channel.json
            agent-linux-*.sha256sum
            agent-linux-*.sha256sum.asc
            agent-linux-*-release-notes.md
            agent-linux-*-release-notes.md.asc

      # 正式版建好页面必须停在 held。上面已把 make_latest 置 false，但那只覆盖
      # 「新建」，重跑同一 tag 时页面可能已在 latest 上——而重跑意味着产物被
      # 重写，上一轮的验收证据随之失效。因此这一步显式收回并读回断言，
      # 让「页面在不该在的位置」当场变红，而不是等装机端收到半成品才暴露。
      - name: Hold release stage
        if: steps.meta.outputs.pre_rel == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh release-stage --stage hold --tag "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}"

      # 上传没有事务：glob 少一项、某个 PUT 被重试吞掉、或上传在 timeout
      # 边缘被截断，页面都会安静地少几件东西，而 action-gh-release 只要
      # 没报错就算「发布成功」。写完之后必须把页面读回来与摘要清单对账，
      # 缺失与多余都判失败；重跑幂等（剪枝 → 上传 → 对账）。
      - name: Audit release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh release-audit --tag "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}"

      # 只给 ISO 出证，等于承认「镜像可追溯、装进系统的 RPM 不可追溯」。
      # 出证与推送分两步：推送失败可以对着同一份产物重试，不必重跑整轮
      # 构建。指纹由 runner 自带的 GITHUB_RUN_ID 与检出提交决定，发布作业
      # 不检出 distro 子模块也不会退化成空配方摘要。
      - name: Attest release assets
        run: ci/ci.sh attest build --kind rel --out . --tag "${{ steps.meta.outputs.tag }}"

      # 出证写盘与推送 registry 是两件事，推送端用 oras 走 OCI；runner 镜像
      # 不带它。同一份 ci/gates/attest.sh 在 image-build 与 payload-seed 里能
      # 跑通，只因那两条流水线各自装了 oras——这里缺一步，发布就会在最后
      # 一步以「缺少命令: oras」收场，页面已建、资产已传、唯独没有证明。
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Publish release attestation
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh attest publish --kind rel --out . --tag "${{ steps.meta.outputs.tag }}" --ref ghcr.io/openairymax/airymaxos --token "$GHCR_TOKEN"
