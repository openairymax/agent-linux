# ===========================================================================
# AirymaxOS release pipeline（L7 发布验证）
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
#            docs/docs-linux/120-development-process/09-release-process.md
# Constraint: 管理仓每个 workflow 最多 2 条流水线
#
# 全部逻辑在 ci/gates/release-*.sh，本文件只保留 checkout → ci/ci.sh <gate>
# → upload。任一步都能在本地对着同一份物料重放，不必重跑整条流水线。
# ===========================================================================

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'          # 稳定版 v0.0.3
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+' # 候选版 v0.0.3-rc1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (如 v0.0.3)'
        required: true

concurrency:
  # 一个 tag 只能有一条发布流水线。tag 重指（收回错误的发布提交）时
  # 必须让新 run 顶掉旧 run，否则两轮 build-and-sign 会并发写同一个
  # Release（0.0.3 收尾期出现过 40206825830 与 40207819634 并行）。
  # 与 image-build 的 cancel-in-progress: false 相反：ISO 组装宁排队不中断，
  # 发布则以最新 tag 指向为准。
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 发布 tag 的唯一来源：tag 推送事件取 ref_name，手动触发取 inputs.tag
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # OCI 镜像名（SSoT: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md §8.4/§8.5）
  OCI_IMAGE: ghcr.io/openairymax/airymaxos

jobs:
  build-and-sign:
    name: Build + SBOM + Sign (L7)
    runs-on: ubuntu-24.04
    # 上限由内核构建步的 210min 决定：前置 checkout/apt 实测 5.3min，
    # 构建后还有 SDK、OCI 与签名约 15min，合计约 230min；240min 只剩
    # 10min 余量，慢镜像即可吃光，故 job 预算提到 300min
    # （GitHub 托管 runner 上限 360min）。
    timeout-minutes: 300
    # 步骤顺序按「失败代价递增」排列：静态门禁（秒）→ 版本与签名密钥自检
    # （秒）→ 依赖安装与 SBOM/SDK（分钟）→ 内核四腿（小时）→ 签名与上传。
    # 代价大的步骤排在不具依赖关系的廉价步骤之后，任何输入错误都在最便宜
    # 的一步暴露，而不是在两小时后。
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发时 github.ref 是默认分支，不指定 ref 会拿分支头顶着
          # 某个 tag 的版本号去构建：tag 指向的提交与产物不再对应，事后
          # 无法用 tag 复现这次发布。tag 推送事件下两者等值，写成显式
          # ref 对两种入口都成立。
          ref: ${{ env.RELEASE_TAG }}
          # 全量历史保证 SOURCE_DATE_EPOCH 可取到确定性提交时间（§3.7）；
          # 递归子模块供 SBOM 扫描与内核构建使用。
          fetch-depth: 0
          submodules: recursive

      # 与 image-build 同一条静态门禁：发布链此前全程无 lint，静态不合格
      # 的树可以直接进到四架构内核构建与签名（0.0.4 清单 CI-06）。
      - name: Static gates
        run: ci/ci.sh distro-lint

      # 归一化、格式校验与 tag/ver 输出都在 gate 里，后续步骤只读输出。
      - name: Derive release version
        id: ver
        run: ci/ci.sh release-version --tag "${RELEASE_TAG}"

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # 私钥缺席或口令错误时，此前要跑满内核四腿（210 分钟）＋SDK＋OCI
      # 才在签名步暴露。probe 在任何长步骤之前做一次真实签名自检。
      - name: Verify GPG signing capability
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ci/ci.sh release-sign probe

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Compute SOURCE_DATE_EPOCH
        id: epoch
        run: echo "value=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Generate + merge SPDX SBOM
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh release-sbom --ver "${{ steps.ver.outputs.ver }}"

      # 同一段安装在暖缓存 runner 上 33s 完成，冷启动 28min，也出现过整步
      # 卡住 45min 以上的实例：镜像源无响应时 apt 没有超时，会把 240min 的
      # job 预算烧光。acquire 超时、重试与硬超时统一收在 ci/lib/apt.sh，
      # 本步只需封顶，让镜像故障表现为一次可重试的失败。
      - name: Install kernel build dependencies and cross toolchains
        timeout-minutes: 60
        run: ci/ci.sh release-deps

      # SDK 与烧录工具同出一门：打包、确定性比对、pyz 实跑自检都在 gate 里。
      # 它与内核构建互不依赖，因此排在内核四腿之前：pyz 自检失败时只花
      # 一分钟，而不是等到最后一腿。
      - name: Pack SDK and airy-flash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh tool-pack --out . --version "${{ steps.ver.outputs.ver }}"

      # 4 架构内核 RPM：单 job 内顺序构建（管理仓 2 job 铁律，不得引入
      # matrix job）。实测 x86_64 60.6min、aarch64 57.5min、riscv64 16.7min，
      # 前三腿已占 135min；末腿 loongarch64 在第 150min 被杀时尚未出包。
      # 旧的 150min 封顶恰好卡在末腿，整轮连同已完成的三个架构一起丢弃。
      # 封顶按实测提到 210min（末腿留 75min），仍在 job 的 300min 之内。
      - name: Build kernel RPM (4 architectures)
        timeout-minutes: 210
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh release-kernel build

      - name: Verify kernel RPM matrix
        run: ci/ci.sh release-kernel matrix

      - name: Build OCI base image
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: ci/ci.sh release-oci build --tag "${{ steps.ver.outputs.tag }}" --ver "${{ steps.ver.outputs.ver }}"

      - name: Sign release artifacts (GPG)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ci/ci.sh release-sign artifacts --ver "${{ steps.ver.outputs.ver }}"

      # 物料 8/9（09-release-process.md §3.1）：以 tools/release-engineering
      # 的确定性实现产出校验和文件与精简 release notes，并即时 GPG 签名。
      # 命名规则：发布资产用 agent-linux-<ver>（§3.2），RPM 包名用 airymaxos-*（§3.3）。
      - name: Generate + sign checksums and release notes
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ci/ci.sh release-sign manifest --ver "${{ steps.ver.outputs.ver }}" --tag "${{ steps.ver.outputs.tag }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.ver.outputs.ver }}
          if-no-files-found: error
          path: |
            dist/rpm/**/*.rpm
            dist/rpm/**/*.rpm.asc
            sbom-agent-linux-${{ steps.ver.outputs.ver }}.spdx.json
            agent-linux-sdk-${{ steps.ver.outputs.ver }}.tar.gz
            agent-linux-sdk-${{ steps.ver.outputs.ver }}.tar.gz.asc
            airy-flash-${{ steps.ver.outputs.ver }}.pyz
            airy-flash-${{ steps.ver.outputs.ver }}.pyz.asc
            oci-image-${{ steps.ver.outputs.tag }}.tar
            agent-linux-${{ steps.ver.outputs.ver }}.sha256sum
            agent-linux-${{ steps.ver.outputs.ver }}.sha256sum.asc
            agent-linux-${{ steps.ver.outputs.ver }}-release-notes.md
            agent-linux-${{ steps.ver.outputs.ver }}-release-notes.md.asc

  publish-release:
    name: Publish + GitHub Release (L7)
    runs-on: ubuntu-24.04
    # 上传制品与写 Release 都是短操作，60 分钟足够；不给默认 360 分钟。
    timeout-minutes: 60
    needs: build-and-sign
    permissions:
      contents: write
      packages: write
    env:
      # -rc/-beta 后缀才是预发布，正式 tag 直接成为 latest；不在发布后人工改状态
      PRE_REL: ${{ contains(needs.build-and-sign.outputs.tag, '-rc') || contains(needs.build-and-sign.outputs.tag, '-beta') }}
    steps:
      # 发布侧同样按 tag 检出：release-verify 读的是 ci/ 与模板，
      # 用默认分支的版本去校验 tag 的产物，等于换了判据。
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ needs.build-and-sign.outputs.ver }}

      # 发布前自证：签名发生在另一台 runner，落盘字节可能已被 artifact
      # 打包解包改写。摘要、署名与 notes 形态在这一步重算，失败即停止，
      # 不进入 registry 与 Release。
      - name: Verify signed artifacts
        run: ci/ci.sh release-verify --dir .

      - uses: sigstore/cosign-installer@v3

      - name: Publish OCI image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh release-oci publish --tag "${{ needs.build-and-sign.outputs.tag }}"

      # 同一个 tag 重发时，旧号 RPM（airymaxos-kernel-*-0.0.3-5.*）会与本次的
      # 新号包并排留在发布页上——glob 上传只增不删。写 Release 之前按摘要清单
      # 把页面收回本次物料。
      - name: Prune stale release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh release-prune --tag "${{ needs.build-and-sign.outputs.tag }}" --repo "${{ github.repository }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-sign.outputs.tag }}
          prerelease: ${{ env.PRE_REL }}
          make_latest: ${{ env.PRE_REL == 'true' && 'false' || 'true' }}
          # release notes 由确定性生成器产出并 GPG 签名，不再使用自动生成
          body_path: agent-linux-${{ needs.build-and-sign.outputs.ver }}-release-notes.md
          files: |
            dist/rpm/**/*.rpm
            dist/rpm/**/*.rpm.asc
            agent-linux-sdk-*.tar.gz
            agent-linux-sdk-*.tar.gz.asc
            airy-flash-*.pyz
            airy-flash-*.pyz.asc
            sbom-agent-linux-*.spdx.json
            agent-linux-*.sha256sum
            agent-linux-*.sha256sum.asc
            agent-linux-*-release-notes.md
            agent-linux-*-release-notes.md.asc
