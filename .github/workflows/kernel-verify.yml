# ===========================================================================
# AirymaxOS kernel 子仓 CI（Kbuild 矩阵 + 静态分析 + 运行时测试）
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
# Gate:      ci/ci.sh <gate>（实现在 ci/gates/，可在本地对着源码树重放）
#
# 本文件只做三件事：checkout、调用门禁、上传产物。任何超过一行 shell 的
# 判断都必须落进 ci/gates/ —— 内联逻辑只能在云端 job 里验证，是这条流水线
# 此前「一堆脚本拼凑」的根因。约束由 ci/check-workflows.py 强制（棘轮）。
#
# 两条 job 的分工：
#   kernel-build   28 格矩阵（4 config × 4 arch × 2 compiler − 4）。每格
#                  一条 kernel-build.sh，参数由 matrix 注入。
#   kernel-verify  零漂移三条 + KUnit + 参考构建 + 三种静态检查 + kselftest。
#                  全部串行是刻意的：KUnit 要求源码树干净，sparse 要求参考
#                  构建的 .o，kselftest 要求参考构建的 bzImage。依赖关系
#                  现在写在 gate 内部并带前置断言，重排步骤会立即报错，
#                  而不是静默退化成假绿。
#
# Rules: OS-STD-TOOL-161（矩阵）/ OS-STD-TOOL-160（checkpatch）
#        OS-STD-TOOL-081-CI（sparse）/ OS-TEST-001~022（KUnit + kselftest）
# ===========================================================================
# 说明：kernel 在管理仓中是 gitlink（submodule 指针），父仓无法枚举其内部
# 文件，因此路径过滤器必须显式包含 'kernel' 以捕获指针变更。
# ===========================================================================

name: kernel-verify
on:
  pull_request:
    paths:
      - 'kernel'
      - 'kernel/**'
      - 'tools/ci-matrix/**'
      - 'tools/kunit-tap-*.tap'
      - 'tools/kunit-tap-diff.py'
      - '.github/workflows/kernel-verify.yml'
      - 'ci/gates/kernel-*.sh'
      - 'ci/lib/**'
  push:
    branches: [main]
    paths:
      - 'kernel'
      - 'kernel/**'
      - 'tools/ci-matrix/**'
      - 'tools/kunit-tap-*.tap'
      - 'tools/kunit-tap-diff.py'
      - '.github/workflows/kernel-verify.yml'
      - 'ci/gates/kernel-*.sh'
      - 'ci/lib/**'

# 最小权限：矩阵只读内核源码与工具，构建产物走 artifact，不碰仓库写接口。
permissions:
  contents: read

concurrency:
  # 同一 ref 只允许一轮矩阵。两次 push 间隔短于矩阵时长时，旧 run 的结论
  # 对新 HEAD 没有意义，却会和它抢同样的 8 个并发额度（0.0.3 收尾期
  # 40327670652 与 40329419054 就是这样并行的），故直接取消旧 run。
  group: kernel-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-build:
    name: Kbuild Matrix (28 configs)
    runs-on: ubuntu-latest
    # 稳态预算 40 分钟（03-ci-cd-pipeline.md §9.4），冷缓存兜底 90 分钟。
    # allmodconfig 的全量模块面（实测约 9.4k 对象）在标准运行器上需要 90 分钟
    # 以上，按 §9.4「超时子集必须拆分」处理：PR 门禁只保留 allmodconfig 的
    # Kconfig 求解与内建面（vmlinux）编译，模块面下沉 nightly。
    # 冷缓存依据：缓存被淘汰时 airy_defconfig / arm64 / clang 实测 62 分钟
    # （run 40310538107 在 60 分钟处被杀时已在收尾模块 BTF），故取 90 分钟兜底。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        config: [defconfig, allnoconfig, allmodconfig, airy_defconfig]
        arch: [x86_64, arm64, riscv, loongarch]
        compiler: [gcc, clang]
        exclude:
          # 上游 clang 尚不支持 loongarch，该架构的 4 个配置组合全部排除：
          # 格数 = 4 配置 × 4 架构 × 2 编译器 − 4 = 28。
          - arch: loongarch
            compiler: clang
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Install build dependencies and toolchain
        run: ci/ci.sh kernel-deps --kind build --arch ${{ matrix.arch }} --compiler ${{ matrix.compiler }}

      # 缓存预算：GitHub 每仓缓存上限 10G，28 格各 2G 的名义总量 56G 必然被
      # LRU 淘汰（实测 "No cache found"），因此只给最慢的 airy_defconfig 七格
      # 建缓存（7×800M≈5.6G），其余格冷构建也在 30 分钟内，不占缓存配额。
      - uses: hendrikmuhs/ccache-action@v1
        if: matrix.config == 'airy_defconfig'
        with:
          key: kernel-${{ matrix.config }}-${{ matrix.arch }}-${{ matrix.compiler }}
          max-size: 800M

      - name: Kbuild ${{ matrix.config }} / ${{ matrix.arch }} / ${{ matrix.compiler }}
        run: ci/ci.sh kernel-build --config ${{ matrix.config }} --arch ${{ matrix.arch }} --compiler ${{ matrix.compiler }} --log "$RUNNER_TEMP/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kbuild-${{ matrix.config }}-${{ matrix.arch }}-${{ matrix.compiler }}
          path: ${{ runner.temp }}/build.log
          retention-days: 3
          if-no-files-found: ignore

  kernel-verify:
    name: Static Analysis + Runtime Tests
    runs-on: ubuntu-latest
    needs: kernel-build
    timeout-minutes: 60
    env:
      KSFT_INSTALL: ${{ github.workspace }}/kselftest-install
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Install analysis and runtime test tools
        run: ci/ci.sh kernel-deps --kind verify

      # 零漂移三连：真值（任务书矩阵 / ABI 黄金样本 / DSL）与生成物必须一致。
      - name: Consistency (matrix / ABI / codegen)
        run: ci/ci.sh kernel-consistency --kind all

      # KUnit 必须在任何 in-tree 构建之前：kbuild 要求源码树干净。
      - name: KUnit on UML + baseline diff
        run: ci/ci.sh kernel-kunit --tap "$RUNNER_TEMP/kunit.tap"

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: kernel-airy_defconfig-x86_64-gcc
          max-size: 2G

      # 参考构建：sparse 拿 .o，kselftest 拿 bzImage，BTF 断言也在这里。
      - name: Reference build (airy_defconfig / x86_64)
        run: ci/ci.sh kernel-refbuild --log "$RUNNER_TEMP/build.log"

      - name: checkpatch.pl --strict
        run: ci/ci.sh kernel-analyze --kind checkpatch --log "$RUNNER_TEMP/checkpatch.log"

      - name: sparse C=2 W=2 on Airymax objects
        run: ci/ci.sh kernel-analyze --kind sparse --log "$RUNNER_TEMP/sparse.log"

      - name: Coccinelle on Airymax directories
        run: ci/ci.sh kernel-analyze --kind coccinelle --log "$RUNNER_TEMP/cocci.log"

      - name: kselftest subset in virtme-ng
        run: ci/ci.sh kernel-kselftest --tap "$RUNNER_TEMP/kselftest.tap"

      - name: Upload verification logs and TAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-verify-evidence
          path: |
            ${{ runner.temp }}/kunit.tap
            ${{ runner.temp }}/kselftest.tap
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/checkpatch.log
            ${{ runner.temp }}/sparse.log
            ${{ runner.temp }}/cocci.log
          retention-days: 7
          if-no-files-found: warn
