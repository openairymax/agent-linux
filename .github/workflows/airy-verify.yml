# ===========================================================================
# agent-linux (AirymaxOS) Airymax-Specific CI Pipeline
#
# 只保留「没有别的门禁在查」的东西。Airymax 专属代码的配置、编译、checkpatch、
# 扩展规则、defconfig 矩阵、BTF 基线与 Kbuild 版本注入已分别由 kernel-verify.yml
# 与 os-chk-verify.yml（tools/os-chk/gates.yaml）承接；这里补的是：
#   airy-build  —— airy_defconfig 在 4 个架构上真的构建成功，且产物确实由
#                  security/airy、kernel/superv… 六个目录构成
#                  （ci/ci.sh kernel-airy --kind assert）
#   airy-static —— Airymax 文件的 SPDX 归属
#                  （ci/ci.sh kernel-airy --kind style）
#
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
# Constraint: 管理仓每个 workflow 最多 2 条流水线
# Rules: OS-BUILD-026 / OS-BUILD-028（defconfig 基线 / 每架构 defconfig）
#        OS-KER-106 / OS-OBS-012（BTF 基线）
#        IRON-3（所有 Airymax 增强代码必须在新增目录中）
# ===========================================================================

name: airy-verify
on:
  pull_request:
    paths:
      # kernel 是 gitlink：子模块指针变化才会出现在这里，路径过滤只能匹配
      # 父仓真实存在的路径，写进 gitlink 内部的 glob 永远不会命中。
      - 'kernel'
      - 'ci/gates/kernel-*.sh'
      - 'ci/lib/**'
      - '.github/workflows/airy-verify.yml'
  push:
    branches: [main]
    paths:
      - 'kernel'
      - 'ci/gates/kernel-*.sh'
      - 'ci/lib/**'
      - '.github/workflows/airy-verify.yml'

# 最小权限：本 workflow 只读源码，构建与测试产物走 artifact。
permissions:
  contents: read

# 同一 ref 只保留最新一轮：新 push 让旧 run 的结论对当前树失效，
# 继续排队只会抢并发额度，并让排障读到旧 run 的日志。
concurrency:
  group: airy-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airy-build:
    name: airy_defconfig build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # kdir 是 $ARCH 映射后的内核源码架构目录名（x86_64 -> x86）。
          # 这张表是 tools/defconfig-matrix 的比对对象，增删项须同步
          # manifest.yaml，否则 OS-BUILD-MATRIX 变红。
          - arch: x86_64
            kdir: x86
            cross: ""
          - arch: arm64
            kdir: arm64
            cross: "aarch64-linux-gnu-"
          - arch: riscv
            kdir: riscv
            cross: "riscv64-linux-gnu-"
          - arch: loongarch
            kdir: loongarch
            cross: "loongarch64-linux-gnu-"
    env:
      CROSS_COMPILE: ${{ matrix.cross }}
      # 交叉工具链单次 apt_install 要拉数十 MB 的 .deb（cpp-13、gcc-13、
      # libc6-dev 各数 MB 到 21 MB）。共享镜像源出现重传时，默认 900s 的
      # 整条命令硬超时会被打满而误判失败。本 job 预算 90min，放宽到 2400s；
      # acquire 级超时与重试仍由 ci/lib/apt.sh 控制，镜像无响应时不会无限等待。
      APT_TIMEOUT: "2400"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install build dependencies and cross toolchain
        run: ci/ci.sh kernel-deps --kind build --arch ${{ matrix.arch }}
      - name: Build airy_defconfig
        run: ci/ci.sh kernel-build --config airy_defconfig --arch ${{ matrix.arch }} --compiler gcc --log "$RUNNER_TEMP/build.log"
      - name: Assert Airymax ownership of the build
        run: ci/ci.sh kernel-airy --kind assert --arch ${{ matrix.arch }}
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airy-build-${{ matrix.arch }}
          path: ${{ runner.temp }}/build.log
          retention-days: 7
          if-no-files-found: ignore

  airy-static:
    name: Airymax SPDX audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Audit SPDX identifiers
        run: ci/ci.sh kernel-airy --kind style
