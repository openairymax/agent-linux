# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# codegen 一致性校验：契约源 → 生成产物，零漂移（SSoT gate）
# ===========================================================================
# Authority: docs-linux/30-interfaces/06-codegen-pipeline.md §7.2 / §9.3
# Rules: R-01（syscall.xml）/ R-02（structures_*.bf）SSoT
#        IRON-9（生成产物禁止手工修改，CI 强制零漂移）
# ---------------------------------------------------------------------------
# 说明：生成产物位于 kernel 子模块内（kernel/include/uapi/linux/airymax/*、
# kernel/arch/x86/entry/syscalls/syscall_64.tbl、sdk/**），管理仓根的
# `git diff --exit-code` 无法观测子模块内部改动。故本 workflow 采用
# tools/codegen/run_codegen.py --check（内容比对，跨子模块生效）作为
# 唯一漂移判定，比 §7.2 的 git diff 机制更严格且与子模块布局兼容。
# ===========================================================================

name: codegen-verify
on:
  pull_request:
    paths:
      - 'tools/codegen/**'
      - 'sdk/**'
      - 'kernel'
      - 'security'
  push:
    branches: [main, develop]
    paths:
      - 'tools/codegen/**'
      - 'sdk/**'
      - 'kernel'
      - 'security'

# 最小权限：本 workflow 全程只读，显式声明后不再依赖仓库默认设置。
permissions:
  contents: read

# 同一 ref 只保留最新一轮：新 push 让旧 run 的结论对当前树失效，
# 继续排队只会抢并发额度，并让排障读到旧 run 的日志。
concurrency:
  group: codegen-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen-diff-check:
    name: Codegen SSoT Drift Check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install codegen dependencies and verify zero drift (IRON-9)
        run: ci/ci.sh python-verify --kind codegen
