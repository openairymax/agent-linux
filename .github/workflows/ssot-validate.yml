# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# SSoT 校验流水线（2 jobs：YAML 语法/规则 ID + 本仓文档交叉引用一致性）
# ===========================================================================
# Authority: docs/docs-linux/50-engineering-standards/09-ssot-registry.md
#            docs/docs-linux/70-build-system/03-ci-cd-pipeline.md §6
# Design: 管理仓只校验本仓自有 .md；file-integrity 与子仓编排见
#         mgmt-orchestrator.yml
# ===========================================================================

name: ssot-validate
on:
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - 'ssot-registry.yaml'
      - 'tools/validate-ssot.py'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── Job 1: SSoT YAML 语法 + 规则 ID 注册一致性 ─────────────────────
  # 合并原 ssot-validate + doc-format 的 YAML 校验部分
  ssot-syntax-and-rules:
    name: SSoT YAML Syntax & Rule ID Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate SSoT YAML syntax + rule count
        run: |
          set -e
          YAML_FILE="ssot-registry.yaml"
          if [ ! -f "$YAML_FILE" ]; then
            echo "ERROR: $YAML_FILE not found at management repo root"
            exit 1
          fi
          python3 - "$YAML_FILE" <<'PY'
          import sys, re, yaml
          with open(sys.argv[1]) as f:
              data = yaml.safe_load(f)
          total = 0
          for key in ('agentrt_linux_rules', 'agentrt_rules'):
              for g in data.get(key, []) or []:
                  total += len(g.get('entries', []) or [])
                  for r in g.get('ranges', []) or []:
                      s = int(re.search(r'(\d+)$', r['start']).group(1))
                      e = int(re.search(r'(\d+)$', r['end']).group(1))
                      total += (e - s + 1)
                  total += len(g.get('individual_entries', []) or [])
          print(f'YAML valid. Registered rule IDs: {total}')
          PY

      - name: Validate rule IDs against SSoT registry (OS-IRON-015)
        run: python3 tools/validate-ssot.py . ssot-registry.yaml

  # ─── Job 2: 本仓自有 .md 相对链接一致性 ─────────────────────────────
  # 仅扫描被 git 跟踪的本仓 .md；跨仓（../）与外链（http）交由各仓自检
  doc-links:
    name: Repo-Owned Markdown Link Integrity
    runs-on: ubuntu-latest
    needs: ssot-syntax-and-rules
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }

      - name: Verify relative markdown links resolve
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          listed = subprocess.run(
              ['git', 'ls-files', '-z', '--', '*.md'],
              capture_output=True, check=True,
          ).stdout.decode('utf-8', errors='replace')
          broken = 0
          for path in [p for p in listed.split('\0') if p]:
              with open(path, encoding='utf-8', errors='ignore') as fh:
                  for i, line in enumerate(fh, 1):
                      for m in re.finditer(r'\]\(([^)]+\.md[^)]*)\)', line):
                          link = m.group(1).split('#')[0].strip()
                          if (not link
                                  or link.startswith(('http://', 'https://', 'mailto:'))
                                  or link.startswith('../')):
                              continue
                          target = os.path.normpath(
                              os.path.join(os.path.dirname(path), link))
                          if not os.path.exists(target):
                              print(f'BROKEN LINK: {path}:{i} -> {link}')
                              broken += 1
          if broken:
              print(f'FAIL: {broken} broken relative markdown link(s)')
              sys.exit(1)
          print('OK: all repo-owned relative markdown links resolve')
          PY
