# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# 管理仓编排 CI（2 jobs：文件完整性 + 子仓编排）
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
# Design: 管理仓只做必要验证（SSoT/file-integrity/submodule-orchestration）
#         语言级 CI 下沉到各叶子子仓 .github/workflows/
# ===========================================================================

name: mgmt-orchestrator
on:
  pull_request:
    paths:
      - '**.md'
      - '.gitmodules'
      - 'ssot-registry.yaml'
      - 'MAINTAINERS'
      - 'CODEOWNERS'
      - 'tools/**'
      - '.github/**'
  push:
    branches: [main]

jobs:
  # ─── Job 1: 治理文件完整性 ─────────────────────────────────────────
  # 合并原 file-integrity + submodule-status 两个 job
  file-integrity:
    name: Governance File & Submodule Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # 子模块清单从 .gitmodules 单一来源派生，避免与 9 个叶子仓漂移
      - name: Verify submodule directories exist
        run: |
          set -e
          mapfile -t SUBS < <(
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk '{print $2}'
          )
          if [ "${#SUBS[@]}" -eq 0 ]; then
            echo "FAIL: .gitmodules declares no submodules"
            exit 1
          fi
          for sub in "${SUBS[@]}"; do
            if [ ! -d "$sub" ]; then
              echo "FAIL: $sub/ missing"
              exit 1
            fi
            echo "OK: $sub/"
          done
          echo "OK: all ${#SUBS[@]} submodule directories present"

      - name: Verify submodule checkout matches .gitmodules
        run: |
          set -e
          declared=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | sort)
          checked=$(git submodule status | awk '{print $2}' | sort)
          if [ "$declared" != "$checked" ]; then
            echo "FAIL: submodule status diverges from .gitmodules"
            diff <(echo "$declared") <(echo "$checked") || true
            exit 1
          fi
          echo "OK: submodule status consistent with .gitmodules"

      - name: Verify [SC] 12 shared headers exist
        run: |
          set -e
          for h in error.h log_types.h ipc.h sched.h memory_types.h \
                   security_types.h cognition_types.h syscalls.h syscall_gen.h \
                   uapi_compat.h lsm_types.h bpf_struct_ops.h; do
            test -f "kernel/include/uapi/linux/airymax/$h" || { echo "FAIL: $h missing"; exit 1; }
          done

      - name: Verify required governance files
        run: |
          set -e
          for f in README.md README_zh.md LICENSE NOTICE CONTRIBUTING.md \
                   MAINTAINERS SECURITY.md .editorconfig .clang-format \
                   CODEOWNERS .gitignore .gitmodules; do
            test -f "$f" || { echo "FAIL: $f missing"; exit 1; }
          done

      - name: Check no airymaxos- prefix (2026-07-12 decision)
        run: |
          set -e
          if grep -r "airymaxos-" README.md README_zh.md MAINTAINERS 2>/dev/null; then
            echo "FAIL: deprecated 'airymaxos-' prefix found"
            exit 1
          fi
          echo "OK: no airymaxos- prefix"

  # ─── Job 2: 子仓 CI 编排 ────────────────────────────────────────────
  # 合并原 subrepo-status + doc-format 两个 job
  orchestrate-leaf-ci:
    name: Orchestrate Leaf Submodule CI
    runs-on: ubuntu-latest
    needs: file-integrity
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # 叶子仓未全部接入 CI 时其状态为 unknown，仅告警；red 才阻断
      - name: Aggregate leaf submodule CI status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/aggregate-subrepo-ci.py --fail-on-red

      # 仅校验本仓自有 .md，避免扫入子模块内容
      - name: markdownlint (repository-owned markdown)
        run: |
          npm install -g markdownlint-cli2
          markdownlint-cli2 '*.md' '.github/**/*.md' 'tools/**/*.md'

      - name: Verify copyright header (line 1)
        run: python3 tools/check-copyright.py --root .
