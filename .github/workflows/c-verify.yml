# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# 用户态 C 组件 CI（4 jobs：cloudnative / services / system / tests-linux）
# services 作业内分步执行 config_d 与 logger_d 契约门禁，预算内不拆作业。
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
# Design: 一个构建面一条流水线，模块各占一个作业，互不掩盖失败结论
# ===========================================================================

name: c-verify
on:
  pull_request:
    paths:
      - 'cloudnative'
      - 'services'
      - 'system'
      - 'tests-linux'
      # [SC] 头文件随 kernel gitlink 升级；用户态 C 组件按 UAPI 编译，
      # 契约头变化必须重编，否则只有装机后才发现不兼容。
      - 'kernel'
      - 'ci/gates/c-verify.sh'
      - 'ci/gates/config-d.sh'
      - 'ci/gates/logger-d.sh'
      - 'ci/gates/macro-d.sh'
      - 'ci/gates/tests-linux.sh'
      - 'ci/lib/**'
      - '.github/workflows/c-verify.yml'
  push:
    branches: [main]
    paths:
      - 'cloudnative'
      - 'services'
      - 'system'
      - 'tests-linux'
      - 'kernel'
      - 'ci/gates/c-verify.sh'
      - 'ci/gates/config-d.sh'
      - 'ci/gates/logger-d.sh'
      - 'ci/gates/macro-d.sh'
      - 'ci/gates/tests-linux.sh'
      - 'ci/lib/**'
      - '.github/workflows/c-verify.yml'

permissions:
  contents: read

concurrency:
  group: c-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: cloudnative（agentctl + 契约冒烟） ────────────────────────
  cloudnative:
    name: cloudnative build & contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Build cloudnative
        run: ci/ci.sh c-verify --module cloudnative

  # ─── Job 2: services（daemon 框架 + 出厂配置/日志守护契约） ──────────
  # config_d 与 logger_d 是 services 模块内的守护，装载契约与 unit 契约
  # 各自独立成门禁；同一条作业内分步执行，结论按 step 归因，不互相掩盖。
  services:
    name: services build & ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Build services
        run: ci/ci.sh c-verify --module services
      - name: Verify config_d
        run: ci/ci.sh config-d
      - name: Verify logger_d
        run: ci/ci.sh logger-d
      - name: Verify macro_d
        run: ci/ci.sh macro-d

  # ─── Job 3: system（airymaxmon + CTest） ─────────────────────────────
  # 此前的 system 只被 Rust 与 Python 门禁覆盖：CMake 目标 airymaxmon 与
  # 四条 CTest 用例从未被任何作业执行过，-Werror 是否成立无从判定。
  system:
    name: system build & ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Build system
        run: ci/ci.sh c-verify --module system

  # ─── Job 4: tests-linux（UAPI 契约套件 + CTest） ─────────────────────
  tests-linux:
    name: tests-linux build & ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Build tests-linux
        run: ci/ci.sh c-verify --module tests-linux
      - name: Verify suite
        run: ci/ci.sh tests-linux
