# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# 用户态 C 组件 CI（5 jobs：cloudnative / services / system / tests-linux / config-d，各自独立）
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
# Design: 一个构建面一条流水线，模块各占一个作业，互不掩盖失败结论
# ===========================================================================

name: c-verify
on:
  pull_request:
    paths:
      - 'cloudnative'
      - 'services'
      - 'system'
      - 'tests-linux'
      # [SC] 头文件随 kernel gitlink 升级；用户态 C 组件按 UAPI 编译，
      # 契约头变化必须重编，否则只有装机后才发现不兼容。
      - 'kernel'
      - 'ci/gates/c-verify.sh'
      - 'ci/gates/config-d.sh'
      - 'ci/gates/logger-d.sh'
      - 'ci/lib/**'
      - '.github/workflows/c-verify.yml'
  push:
    branches: [main]
    paths:
      - 'cloudnative'
      - 'services'
      - 'system'
      - 'tests-linux'
      - 'kernel'
      - 'ci/gates/c-verify.sh'
      - 'ci/gates/config-d.sh'
      - 'ci/gates/logger-d.sh'
      - 'ci/lib/**'
      - '.github/workflows/c-verify.yml'

permissions:
  contents: read

concurrency:
  group: c-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: cloudnative（agentctl + 契约冒烟） ────────────────────────
  cloudnative:
    name: cloudnative build & contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Build cloudnative
        run: ci/ci.sh c-verify --module cloudnative

  # ─── Job 2: services（daemon 框架 + CTest） ──────────────────────────
  services:
    name: services build & ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Build services
        run: ci/ci.sh c-verify --module services

  # ─── Job 3: system（airymaxmon + CTest） ─────────────────────────────
  # 此前的 system 只被 Rust 与 Python 门禁覆盖：CMake 目标 airymaxmon 与
  # 四条 CTest 用例从未被任何作业执行过，-Werror 是否成立无从判定。
  system:
    name: system build & ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Build system
        run: ci/ci.sh c-verify --module system

  # ─── Job 4: tests-linux（测试骨架 + CTest） ──────────────────────────
  tests-linux:
    name: tests-linux build & ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Build tests-linux
        run: ci/ci.sh c-verify --module tests-linux

  # ─── Job 5: config-d（A-UCS 装载契约） ──────────────────────────────
  # 出厂配置与内置默认值同源、拒绝路径可归因、conf.d 叠加顺序与 unit
  # 契约，都是装机后才暴露的判据，必须在构建期就固定下来。
  config-d:
    name: config-d contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Verify config_d
        run: ci/ci.sh config-d

  # ─── Job 6: logger-d（A-ULP 日志守护） ──────────────────────────────
  # 日志守护与内核日志环是同一份 ABI 的两端：配置漂移、轮转窗口失守
  # 或 unit 契约与出厂配置路径不一致，都只有装机后才暴露，必须在构建
  # 期用单测与契约断言固定下来。
  logger-d:
    name: logger_d build & contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }
      - name: Verify logger_d
        run: ci/ci.sh logger-d
