# ===========================================================================
# AirymaxOS 镜像流水线（L1 组装 + L2/L3 装机验收）
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
#            docs/docs-closed/agent-linux-dev/0.0.3-极境OS任务方案.md §14 §3/§4/§8
# Gate:      ci/ci.sh <gate>（实现在 ci/gates/，可在本地对着产物重放）
#
# 本文件只做三件事：checkout、调用门禁、上传产物。任何超过一行 shell 的
# 判断都必须落进 ci/gates/ —— 内联逻辑只能在云端 job 里验证，是这条流水线
# 此前「一堆脚本拼凑」的根因。约束由 ci/check-workflows.py 强制（棘轮）。
#
# 约束：
#   * 仅 workflow_dispatch：不进入 PR 门禁，不阻断日常提交（§3.6）。
#   * 本流水线固定 assemble + accept 两个 job（上限 2，与 docs 一致）。
#   * 60 分钟预算（OS-STD-TEST-011）只约束 PR 门禁；本流水线按 release.yml
#     先例申请发布级例外，两个 job 分别为 300 / 360 分钟。
#     assemble 内部按职责分三步：工具链预热（受网络支配，75 分钟）、ISO
#     组装（受 CPU/IO 支配，180 分钟）、收尾校验。三步各自计时，才能看出
#     一轮慢在网络还是慢在编译；混成一步时只有一个总耗时（run
#     40997227280 烧穿 240 分钟而无从归因）。
#     组装 180 分钟的依据：闭包收割要在这一步里从公网取回 2.5 GB RPM，
#     镜像站限速时单轮曾只有 29 KiB/s（run 41023530128 在 120 分钟时被
#     强制取消）。跨轮缓存池把「每轮重取」降为「每轮补差」，180 分钟覆盖
#     无缓存的首轮与有缓存的补齐两种形态；job 300 分钟必须大于 75+180，
#     否则强制取消态下 log-dump 与产物上传都不会执行。
#     内核模块数两千余（openeuler_defconfig），在 4 核 runner 上明显长于
#     x86_64_defconfig（run 40025896195 的 12.2 分钟不再可比）。
#   * accept 的时限不是拍定值，而由装机腿数推导：U 盘一条腿、CD-ROM 两条
#     固件腿，三条腿各自成步且各带 80 分钟 step 时限（> 装机 3600 秒 +
#     冷启动 900 秒），累计 240 分钟仍小于 job 的 360 分钟。分步的用意是
#     归因：合成一步时只有总耗时，卡在 BIOS 装机还是 UEFI 冷启动无从区分。
#     主机没有对应固件时该腿直接跳过。托管 runner 实测提供 /dev/kvm
#     （run 39371790961 记录的加速器为 kvm），预算仍按 TCG 最坏情况保留，
#     避免 runner 形态变化导致 job 被中途取消。
#   * 源码以只读方式挂载进构建容器，产物只落 $RUNNER_TEMP/out，不违反
#     「严禁在 airymaxhub 源码区内构建」。
#   * 子模块由 ci/gates/submodules.sh 按需取：distro 与 system 是组装链的
#     全部读点，kernel 只在复用 Release 内核包以外的路径上读。递归 checkout
#     会多拉七棵树（kernel 1.5G），它们不进产物，只抬固定开销（W-1）。
#   * ISO 基线固定为 openEuler 24.03-LTS-SP3 netinst，容器镜像取官方
#     docker_img tar；URL 与 sha256 同时写死，禁止浮动 latest。
#   * 官方源是跨洋链路，实测单件 ISO 需 43 分钟。介质目录按摘要键缓存，
#     命中即跳过下载；未命中时总预算 5400 秒、每项保底 900 秒，避免先下
#     的大件把后一项挤成零头（run 40485745100）。
#   * 安装闭包（约 2.5 GB RPM）另走一块滚动缓存池。actions/cache 的条目
#     不可变，键的设计要同时避开两种坏结局：固定键让第一轮超时留下的半份
#     池被永久固化；纯 run_id 键则每轮落一份完整副本、十 GiB 配额只够存
#     三轮。键的前缀取闭包定义的摘要（镜像根表 + 配方），后缀取池内容的
#     摘要（ci/gates/pool-state.sh），于是同一份池只存一次，池长大才有新
#     条目；空池一律不保存，否则早退轮次会把空条目钉在前缀最新的位置，
#     后续每轮都从零开始（run 41056762297 起连续复现的形态）。
#   * acceptance=true 组装验收 ISO（自动登录 + 会话内冒烟），accept 断言
#     AIRYMAX-SMOKE-PASS；false 时断言产品 ISO 的 AIRYMAX-DESKTOP-READY。
#   * release_tag 非空时，内核包取自对应 Release（下载并校验发行
#     .sha256sum）而不是就地构建：ISO 载荷与发行资产的内核只能有一次
#     构建，否则同名包哈希分叉，装机载荷无法用发行校验和核验。
#   * ISO 发布挂在 accept 之后并排除验收剖面：只有双固件装机与冷启动
#     通过的字节才配占用发行 tag。
# ===========================================================================

name: image-build

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: '组装验收 ISO（B 轮：自动登录 + 会话内冒烟）'
        type: boolean
        default: false
      release_tag:
        description: '复用该 Release 的内核包（如 v0.0.3；留空则就地构建）'
        type: string
        default: ''
      rpms_run:
        description: '改从该 release run 的制品取内核包（首个版本建页前用）'
        type: string
        default: ''
      replace:
        description: '覆盖 ghcr 同 tag 的既有产物（仅重建同版本发行物时开启）'
        type: boolean
        default: false

concurrency:
  group: image-build
  cancel-in-progress: false

permissions:
  contents: read
  # 首个版本的发行内核包取自发布 run 的制品（release-rpms --run-id），
  # 读他人 run 的制品需要 actions: read。
  actions: read
  # ISO 经 ghcr 的 blob 通道交付（Release 单资产上限 2 GiB），需要写包权限。
  packages: write

env:
  OE_ISO_NAME: openEuler-24.03-LTS-SP3-netinst-x86_64-dvd.iso
  OE_ISO_SHA256: 808aa41bb0b25bb56768c550625bec9e4982094b8d4024be64fa0c6517e22900
  OE_IMG_NAME: openEuler-docker.x86_64.tar.xz
  OE_IMG_SHA256: 0d3075e9d9f996726b9a7936593b2e00c96fd916aac3609f867342911664f1c5
  # 镜像只按 sha256 认定，源可替换：官方源跨洋链路曾整段停滞（run
  # 39543892713 在 Fetch 卡满 55 分钟），国内镜像作等价回退，摘要不符即弃。
  # 镜像根的唯一声明处是 distro/repo/mirrors.list，media-fetch.sh 与闭包
  # 收割都读它，此处不再复制一份（此前 OE_MIRRORS 无消费者，已删除）。

jobs:
  # ─── Job 1: RPM + 内核 + ISO 组装（源码只读，产物出源码区） ─────────────
  assemble:
    name: Assemble ISO (L1)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      # 子模块按需取：递归 checkout 要把九棵树全拉下来，其中 kernel 1.5G，
      # 而组装只有「不复用 Release 内核包」时才读它，其余六棵在组装链里
      # 没有读点。这份下载不影响产物字节，只把每轮固定开销抬高几分钟（W-1）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      # 构建侧只看得到自己被 checkout 的那一份。本地有、镜像还没收的提交
      # 照样能编出校验和齐全的发行物，只是没有任何远程取得到它的源码，
      # 于是这份产物不可复现也不可追溯（CI-07）。这一步最便宜，放最前面。
      - name: Origin tip check
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # 标签派发与分支派发查的是两个命名空间，而 github.ref_name 把
          # refs/ 前缀剥掉之后二者无法区分。缺 --kind 时门禁按 heads 查
          # refs/heads/v0.0.4，标签派发必然报「无此分支」（run 42335415156）。
          KIND: ${{ startsWith(github.ref, 'refs/tags/') && 'tags' || 'heads' }}
        run: ci/ci.sh remote-sync --kind "$KIND" --ref "$REF" --sha "$SHA" --remote origin

      # 与后面 Fetch release kernel RPMs 同一判据：有发行包就不建内核，
      # 也就不需要 kernel 源码树。条件写在参数里，门禁本身不猜。
      - name: Checkout submodules
        run: ci/ci.sh submodules ${{ inputs.release_tag == '' && '--need-kernel' || '' }}

      # 静态门禁必须先于组装：spec / comps / kickstart 改坏一条断言，代价
      # 是整轮 240 分钟组装白跑。此前 assemble 首步是 free-disk，静态不合格
      # 的树照样能进到 ISO 阶段（0.0.4 清单 CI-06）。
      # --no-tests 只跳过规则回归那一段：它判的是仓库内容，push 门禁已在同一
      # 提交上全量跑过，组装再跑一遍不增加判据，却要付 111 秒（CI-16）。其余
      # 五段合计不足两秒，留着——dispatch 可以指向任何历史提交，不必假设它
      # 一定走过 push 门禁。
      - name: Static gates
        run: ci/ci.sh distro-lint --no-tests

      - name: Free runner disk
        run: ci/ci.sh free-disk

      # 复用的发行包必须与树内版本同源。只校验 tag 格式不够：0.0.3 收尾期
      # 用 release_tag=v0.0.3 派发了树内 0.0.4 的组装，直到 11 分钟后的
      # Verify assembly manifest 才因「载荷内核包不在 v0.0.3 的摘要里」失败，
      # 期间预热与介质下载全部白跑。版本同源是两三秒的判定，放在最前。
      - name: Check release tag against tree version
        if: inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag }}
        run: ci/ci.sh release-version --tag "$TAG"

      # 发行资产里的内核包是 ISO 载荷的内核来源。只下载与校验，不重建：
      # 只要 ISO 自己再编一次内核，载荷中同名包的哈希就与发行 .sha256sum
      # 分叉，装机介质也就无法用发行校验和核验。
      # 位置在整条链路的最前：tag 写错、资产缺失、摘要不符都只花一分钟，
      # 而它排在工具链预热之后时，同样的错误要等 75 分钟才暴露。
      # 按四个架构各取一份：制品本来就是整包下载，多架构只多几次校验，却让
      # 后面的固件预演能同时看到每个架构的模块树——riscv64 没有实机兜底，
      # ARM 的板载无线在 QEMU 里不出现，这条判据只能在这里成立。
      - name: Fetch release kernel RPMs
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: ci/ci.sh release-rpms --tag "$TAG" --repo "$GITHUB_REPOSITORY" --arch x86_64 --arch aarch64 --arch riscv64 --arch loongarch64 --dir "$RUNNER_TEMP/rel-rpms" ${{ inputs.rpms_run != '' && format('--run-id {0}', inputs.rpms_run) || '' }}

      # 介质由 sha256 固定、跨轮不变：整目录以摘要为键缓存。命中时 3.2 GiB
      # 下载（run 40485745100 的 ISO 单件就占 43 分钟）退化为本地解包，
      # 重复轮次不再受跨洋链路速率左右。
      - name: Restore openEuler media
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/media
          key: oe-media-${{ env.OE_ISO_SHA256 }}-${{ env.OE_IMG_SHA256 }}

      - name: Fetch fixed openEuler media
        run: ci/ci.sh media-fetch --dir "$RUNNER_TEMP/media" --budget 5400 --floor 900 "$OE_ISO_NAME" ISO/x86_64 "$OE_ISO_SHA256" "$OE_IMG_NAME" docker_img/x86_64 "$OE_IMG_SHA256"

      # 工具链 34 个直接依赖会解析出 1273 个包，全部跨公网取。这一步的耗时
      # 由镜像站状态决定而非代码决定：同一棵树在 run 40818193756 是 14 分钟，
      # 在 run 40866231339 涨到两小时并烧穿 job 预算。缓存按工具链清单的
      # 摘要做键——清单不变则包集合不变，命中后 dnf 只做本地事务安装。
      # 键里不含产物内容：缓存只影响「装得快不快」，不影响 ISO 字节。
      #
      # 这里只做恢复，保存由后面显式的 cache/save 完成：actions/cache 的
      # 保存挂在 job 成功态上，job 被取消或超时（run 40997227280）缓存就
      # 永远不落盘，下一轮又从零下载，越慢越容易被取消，形成自锁环。
      - name: Restore dnf toolchain cache
        id: dnf
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dnf-cache
          key: dnf-${{ hashFiles('ci/container/build-packages.txt') }}
          restore-keys: dnf-

      - name: Load build container image
        run: ci/ci.sh container-load --file "$RUNNER_TEMP/media/$OE_IMG_NAME"

      # 工具链获取与 ISO 组装拆成两步：前者受网络支配、后者受 CPU/IO 支配，
      # 混在一步时 Actions 只报一个总耗时，排障看不出瓶颈在哪。warm 收尾会
      # 用干净容器自证缓存可离线安装，装配段因此能严格离线。
      - name: Warm toolchain cache
        id: warm
        timeout-minutes: 75
        run: ci/ci.sh toolchain --image "$AIRYMAX_BUILD_IMAGE" --cache "$RUNNER_TEMP/dnf-cache"

      # 显式保存且不看 job 成功态：warm 中途失败时，已下载的 rpm 仍有价值，
      # 下一轮从这些包继续，而不是回到零。
      #
      # 键分两种：自证通过（warm 成功）才写精确键，它代表「缓存足以离线安装」，
      # 后续轮命中即跳过在线段；未通过则写滚动键，靠 restore-keys 的 dnf-
      # 前缀被下一轮捡走。半份缓存若落在精确键上，cache-hit 恒真、保存分支
      # 永不触发，每一轮都只能从公网补差且补不全，形成自锁环
      # （run 41613120035：命中 371 MiB 的半份缓存，离线自证立刻失败）。
      - name: Save dnf toolchain cache
        if: always() && steps.dnf.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dnf-cache
          key: ${{ steps.warm.outcome == 'success' && format('dnf-{0}', hashFiles('ci/container/build-packages.txt')) || format('dnf-{0}-partial-{1}', hashFiles('ci/container/build-packages.txt'), github.run_id) }}

      # 键分两段：前缀是闭包定义的摘要（镜像根表 + 配方），后缀是池内容的
      # 摘要。前者让「闭包定义没变」的轮次优先命中同一代，后者让同一份池
      # 只存一份。第一段缺席时（首次播种）按 closure- 回落到旧代的池。
      - name: Restore closure RPM pool
        id: pool
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/closure-cache
          key: closure-${{ hashFiles('distro/repo/mirrors.list', 'distro/kickstart/airymaxos-workstation.ks') }}-${{ github.run_id }}
          restore-keys: |
            closure-${{ hashFiles('distro/repo/mirrors.list', 'distro/kickstart/airymaxos-workstation.ks') }}-
            closure-

      # 播种把「跨境取 2.5 GB」换成「取回一份已在快机器上收好的池」：
      # 托管 runner 到国内镜像实测 16–22 KiB/s，180 分钟收不完；国内验证机
      # 6–7 MB/s，几分钟收完（ci/gates/closure-pool.sh）。判据是池内的完成
      # 标记而不是「目录非空」：中断轮次留下的半份池同样非空，以非空判完整
      # 就会跳过播种，缺的包回到跨境镜像慢慢取（run 41075519752：缓存
      # 564 MiB、制品 2321.7 MiB、播种 0 秒，构建段 40 分钟仍在拉包）。
      # 制品尚未发布时本步退 0，回落在线的慢路径，不会把「没播种」伪装成
      # 「播种成功」。
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      # 输入指纹在下载任何 RPM 之前就能算出来：五段仓库的 repomd 摘要、comps、
      # 锁定输入、配方与镜像根表。预热端（payload-seed.yml）按同一指纹把整份
      # 载荷推成 seed- 层，此处命中即拿到与当前上游一致的字节，不必再跨境收割。
      # 层未发布或上游不可达时退 0，由下一步的老制品与在线求解接住：预热只
      # 负责让层提前存在，任何一方都不得先跑完不可。
      - name: Seed closure RPM pool by input key
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh payload-seed fetch --dir "$RUNNER_TEMP/closure-cache" --arch x86_64 --token "$GHCR_TOKEN"

      - name: Seed closure RPM pool
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/ci.sh pool-seed --dir "$RUNNER_TEMP/closure-cache" --token "$GHCR_TOKEN"

      # 固件预演：判据的两半只有这一刻同时在场——固件名字集在闭包池里
      # （linux-firmware 是 noarch，四个架构共用一份），模块树的请求名在
      # 发行内核包目录里。走过这一步，另外三个架构的模块树就不在宿主上了。
      # 装机后的 T26 只看镜像自己的 rootfs，回答不了「该架构模块树请求的
      # 固件，固件树里到底有没有」；riscv64 没有实机，ARM 的板载无线在
      # QEMU 里也不出现，能拦的只有这里。
      # 两条取件路径都交齐四个架构：build-and-sign 的矩阵本身就是四腿，
      # 制品与发布页（dist/rpm/**/*.rpm）因而都带四份内核包。此前按「发布页
      # 只有 x86_64」给发行页路径留了单架构分支，前提是错的，后果是那条路
      # 上的 riscv64 无人判——而它没有实机兜底，这里漏掉就再没别处能拦。
      - name: Preflight firmware layout per architecture
        if: inputs.release_tag != ''
        run: ci/ci.sh fw-preflight --image "$AIRYMAX_BUILD_IMAGE" --pool "$RUNNER_TEMP/closure-cache" --rpms "$RUNNER_TEMP/rel-rpms" --arch x86_64 --arch aarch64 --arch riscv64 --arch loongarch64

      # step 级时限必须小于 job 时限（300）：job 超时是强制取消，取消态下
      # `if: failure()` 的 log-dump 与 `if: always()` 的产物上传都不会执行，
      # 等于跑满五小时后既没有 ISO 也没有日志（run 40997227280 的现象）。
      # 工具链已移出本步，剩下的只有本地的内核编译、闭包收割与 ISO 组装：
      # warm 75 分钟加本步 180 分钟仍在 300 分钟之内，并给 log-dump、
      # manifest 校验与上传留出余量。
      - name: Build desktop ISO in container
        timeout-minutes: 180
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
          # 构建来源指纹（REL-03）：run id + 提交短 sha 写进 os-release 的
          # BUILD_ID 与 /etc/airymaxos-build。同一版本号会随每次提交产出
          # 不同镜像，没有这组锚点时装机现场只能回看流水线日志猜是哪一轮。
          AIRYMAX_RUN_ID: ${{ github.run_id }}
          AIRYMAX_COMMIT: ${{ github.sha }}
        run: ci/ci.sh assemble --image "$AIRYMAX_BUILD_IMAGE" --src "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/out" --media "$RUNNER_TEMP/media" --iso-base "$OE_ISO_NAME" --dnf-cache "$RUNNER_TEMP/dnf-cache" --closure-cache "$RUNNER_TEMP/closure-cache"

      # 段耗时入账：同一棵树曾一次 16.5 分钟、一次 45 分钟还没跑完，而
      # 页面上只有一个 step 总耗时，看不出慢在取包、编内核还是组 ISO。
      # 耗时表进 job summary，超基线 2 倍的段打 AIRY-BUILD-DRIFT——慢但
      # 产物正确的构建不判负，但必须留下可检索的标记（CI-08）。
      - name: Account build segments
        if: always()
        run: ci/ci.sh build-drift --manifest "$RUNNER_TEMP/out/image-ci-manifest.txt" --summary "$GITHUB_STEP_SUMMARY"

      # 与 dnf 缓存同理：不看 job 成功态。本步跑在中止的轮次里时，已下载并
      # 通过摘要校验的 RPM 仍然有价值，下一轮只补差异。
      #
      # 两条判据缺一不可：空池不保存（否则一次早退的轮次会把空条目钉在
      # restore 前缀的最新位置，后续每轮都从零开始），键取内容摘要（同一份
      # 池不重复落盘，键已存在时保存必然报错，故失败不计入 job 状态）。
      - name: Closure pool state
        id: poolstate
        if: always()
        run: ci/ci.sh pool-state --dir "$RUNNER_TEMP/closure-cache"

      - name: Save closure RPM pool
        if: always() && steps.poolstate.outputs.count != '0'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/closure-cache
          key: closure-${{ hashFiles('distro/repo/mirrors.list', 'distro/kickstart/airymaxos-workstation.ks') }}-${{ steps.poolstate.outputs.digest }}

      - name: Show build logs on failure
        if: failure()
        run: ci/ci.sh log-dump --dir "$RUNNER_TEMP/out"

      - name: Verify assembly manifest
        run: ci/ci.sh image-verify --out "$RUNNER_TEMP/out"

      # 发行自证：ISO 摘要 ↔ 内核 RPM NEVRA 两侧同时给出并逐字相等（0.0.4
      # J-13 / QG-12）。image-verify 只证明载荷包与发行 .sha256sum 同源，
      # 不看版本号；0.0.3 的断裂恰好两侧各自成立却对不上同一版，故须另判
      # NEVRA 与 spec 的 airy_version/airy_release。仅复用发行内核包时成立：
      # 就地构建的轮次没有发行侧，无从对照。
      - name: Verify ISO kernel NEVRA
        if: success() && inputs.release_tag != ''
        run: ci/ci.sh release-verify --iso-dir "$RUNNER_TEMP/out/desktop/iso" --payload "$RUNNER_TEMP/out/desktop/payload/airymax/payload-manifest.txt" --kernel-rpms "$AIRYMAX_REL_RPMS"

      # 登录/锁屏/显示三段闭包：源在盘上不等于链路生效（dconf profile、
      # PAM 顺序、checkpass setuid、gfxpayload）。静态模式不依赖镜像字节，
      # 因此能在这一轮之前就拦住配方退化；产物侧由 --root 在验收腿补判。
      - name: Verify session closure assets
        run: ci/ci.sh session-closure --source .

      # 内置壁纸集合与台账同源：多一张是上游壁纸包漏进闭包，少一张是
      # 注册表指向了不存在的文件，两种都只在桌面会话里表现为空背景。
      - name: Verify wallpaper set
        run: ci/ci.sh wallpaper-set --source .

      # 来源指纹跨七处接线：模板、驱动、清单、配方、产物门禁、容器边界与
      # 运行期探针。任何一处被「顺手简化」，构建照样成功，只有装机现场才
      # 发现这台机器说不出自哪一轮，届时已无从补救。
      - name: Verify build provenance wiring
        run: ci/ci.sh build-provenance --source .

      # 基底选型以 lockfile/base.yaml 为唯一事实源：只取大 SP、EOL 覆盖
      # 收口日、合格候选里 GA 最晚。仓库地址、%oe_base、安装配方任一落伍
      # 都会让装机闭包与冻结集分叉，而 dnf 只会在装机现场报缺仓库。
      - name: Verify openEuler base selection
        run: ci/ci.sh base-eol --source .

      # UKUI 包名与 NVRA 以台账为唯一事实源：基底不存在 ukui 元包，comps
      # 或冻结输入一旦再写出它，装机求解必然失败，而这一步只读台账与
      # 仓内文件，几毫秒即可给出结论。
      - name: Verify UKUI component ledger
        run: ci/ci.sh ukui-lock --source .

      # 通道清单（channel.json）要在 ISO 发布账本写出之后才能生成，而账本
      # 属于 accept。清单同时需要发行包与内核包自证 build 与载荷摘要，故在
      # 这里把两份包随产物交给 accept：跨 job 不共享文件系统，缺这一步
      # accept 就只能手写构建号，清单退回成一组看起来对的字符串。
      # 两个制品根下载后层级不同，门禁按文件名递归取唯一一份。下载侧必须
      # 与门禁同一条判据：release-rpms 解出的内核包保留 dist/rpm/<arch>/
      # 层级（run 42527470419 的 Fetch 步骤日志已写明落点），固定一层 glob
      # 只匹配到发行包一份，accept 的通道清单因此报「No kernel RPM」。
      - name: Upload release rpms
        if: success() && inputs.release_tag != '' && !inputs.acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: airymaxos-release-rpms
          path: |
            ${{ runner.temp }}/out/rpms/RPMS/*/airymaxos-release-*.noarch.rpm
            ${{ runner.temp }}/rel-rpms/**/airymaxos-kernel*.x86_64.rpm
          retention-days: 7
          if-no-files-found: error

      - name: Upload image artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: airymaxos-image
          path: |
            ${{ runner.temp }}/out/desktop/iso/*.iso
            ${{ runner.temp }}/out/desktop/iso/*.sha256
            ${{ runner.temp }}/out/desktop/iso/iso-manifest.txt
            ${{ runner.temp }}/out/desktop/payload/airymax/payload-manifest.txt
            ${{ runner.temp }}/out/image-ci-manifest.txt
            ${{ runner.temp }}/out/acceptance/*.ks
            ${{ runner.temp }}/out/logs/*
            ${{ runner.temp }}/out/*/logs/*.log
            ${{ runner.temp }}/out/*/iso/work/logs/*.log
            ${{ runner.temp }}/out/*/work/logs/*.rpmspec.log
            ${{ runner.temp }}/out/*/work/logs/*.build.log
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      # 预算棘轮：台账为实测各段登记的基线之和，必须仍比整轮实测合计高出
      # 至少 20%。逐段的 AIRY-BUILD-DRIFT 只问单段有没有超上界，六个段各
      # 慢 1.4 倍时它一声不响，合计却已经把余量吃光（CI-03）。放在所有上传
      # 之后：判负的语义是「台账该重新推导了」，不该同时把这一轮的产物丢掉。
      - name: Check build budget
        if: always()
        run: ci/ci.sh build-budget --manifest "$RUNNER_TEMP/out/image-ci-manifest.txt" --summary "$GITHUB_STEP_SUMMARY"

  # ─── Job 2: 装机 + BIOS/UEFI 冷启动 + 桌面就绪断言 ─────────────────────
  accept:
    name: Install + Cold Boot (L2/L3)
    runs-on: ubuntu-24.04
    needs: assemble
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout distro submodule
        run: git submodule update --init distro

      - name: Free runner disk
        run: ci/ci.sh free-disk

      # qemu 与 /dev/kvm 权限同属装机前置：分开两步只会让缺权限在装机跑了
      # 半小时后以超时形式暴露。
      - name: Install QEMU, UEFI firmware, enable KVM
        run: ci/ci.sh qemu-setup --firmware both

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airymaxos-image
          path: ${{ runner.temp }}/image

      - name: Verify ISO checksum
        run: ci/ci.sh iso-checksum --dir "$RUNNER_TEMP/image"

      # 真机安装介质是 U 盘：固件按 MBR/GPT 找到 ESP，与 -cdrom 的 El Torito
      # 通路完全无关。0.0.3 的实机装机失败正是前者错位、后者照常通过。这条
      # 腿放在双固件全量之前，介质布局缺陷在此就地暴露，不必等两个固件都跑完。
      - name: Install and cold boot (UEFI, USB media)
        timeout-minutes: 80
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: ci/ci.sh accept --iso "$AIRYMAX_ISO" --out "$RUNNER_TEMP/install-usb" --firmware uefi --media usb --runs 1 --install-timeout 3600 --boot-timeout 900

      # 两条固件腿各自成步。合为一步时 Actions 只报一个总耗时，BIOS 装机
      # 卡住与 UEFI 冷启动失败在界面上是同一行，只能靠事后翻 TAP 才分得清
      # （run 41121955316 的 CD-ROM 腿跑了 70 分钟仍无法判断停在哪一条）。
      # 分步后步骤名即结论；运行目录按 run-<fw>-<n> 命名，两腿互不覆盖。
      # step 级时限 80 分钟 > 装机 3600 s + 冷启动 900 s，且累计仍小于 job
      # 的 360 分钟，保证超限时先由 step 收尾而不是被 job 强制取消。
      #
      # 产物目录也按固件分开：run-* 目录名虽不同，但 tap.txt 与
      # install-manifest.txt 是每目录一份，两腿共用一个 --out 时后跑的
      # 那腿会把前腿的总账覆盖掉，失败现场只剩一条腿的证据。
      #
      # 腿与腿之间互不阻塞（!cancelled()）：默认的隐式 success() 会让第一
      # 条失败的腿把后面两条整段跳过，于是 B 轮一次只能拿到一条坏腿的证据，
      # 另外两条既没跑过也无从判读（run 42055603410 的 BIOS 腿失败后，
      # UEFI-CD 腿被跳过，证据包因此缺 install-uefi 四件套）。三条腿本就
      # 是三个独立判据：一条腿的失败不该删掉另外两条的证据。job 最终仍按
      # 任一步失败判负，取消（用户中断或超时）时才整体停下。
      - name: Install and cold boot (BIOS, CD-ROM)
        if: ${{ !cancelled() }}
        timeout-minutes: 80
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: ci/ci.sh accept --iso "$AIRYMAX_ISO" --out "$RUNNER_TEMP/install-bios" --firmware bios --media cdrom --runs 1 --install-timeout 3600 --boot-timeout 900

      - name: Install and cold boot (UEFI, CD-ROM)
        if: ${{ !cancelled() }}
        timeout-minutes: 80
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: ci/ci.sh accept --iso "$AIRYMAX_ISO" --out "$RUNNER_TEMP/install-uefi" --firmware uefi --media cdrom --runs 1 --install-timeout 3600 --boot-timeout 900

      - name: Annotate boot failures (USB)
        if: failure()
        run: ci/ci.sh boot-annotate --dir "$RUNNER_TEMP/install-usb"

      - name: Annotate boot failures (BIOS)
        if: failure()
        run: ci/ci.sh boot-annotate --dir "$RUNNER_TEMP/install-bios"

      - name: Annotate boot failures (UEFI)
        if: failure()
        run: ci/ci.sh boot-annotate --dir "$RUNNER_TEMP/install-uefi"

      - name: Extract smoke TAP (USB)
        if: always()
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: ci/ci.sh tap-extract --dir "$RUNNER_TEMP/install-usb"

      - name: Extract smoke TAP (BIOS)
        if: always()
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: ci/ci.sh tap-extract --dir "$RUNNER_TEMP/install-bios"

      - name: Extract smoke TAP (UEFI)
        if: always()
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: ci/ci.sh tap-extract --dir "$RUNNER_TEMP/install-uefi"

      # ISO 经 OCI 制品通道交付，与 release.yml 的基础镜像分属两个包
      # （airymaxos-iso / airymaxos），互不覆盖 tag。放在这里而不是 assemble：
      # 组装成功不等于能引导，先发布等于把未经冷启动验证的字节挂成发行物。
      # 验收剖面另有排除理由——它自动登录并跑会话内冒烟，字节与产品 ISO
      # 不同，占用发行 tag 会让两边都无法用 .sha256 自证。
      # 条件里显式写 success()：一旦给出 if 表达式，Actions 就不再套用默认的
      # success()，装机失败时发布步骤反而会被放行。
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        if: success() && inputs.release_tag != '' && !inputs.acceptance

      # 幂等判据是「同 tag 同摘要」，重建同版本发行物必然摘要不同，故覆盖只
      # 能由输入显式开启：默认仍拒绝替换，避免把一次误触当成发行。
      - name: Publish ISO to ghcr.io
        if: success() && inputs.release_tag != '' && !inputs.acceptance
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: ci/ci.sh iso-publish --out "$RUNNER_TEMP/image" --tag "$TAG" ${{ inputs.replace && '--force' || '' }}

      # 证明与 ISO 同批发布：ISO 一进 registry 就不再改动，证明若晚一步生成，
      # 中间就留下「镜像已在、来源只能靠构建日志口头说明」的窗口。buildId 取
      # 自镜像自带的 image-ci-manifest.txt（随制品一起下载），因此证明里的值
      # 与装机后 /etc/airymaxos-build 逐字相同——这是「装机可反查」的全部依据。
      - name: Build ISO provenance attestation
        if: success() && inputs.release_tag != '' && !inputs.acceptance
        env:
          TAG: ${{ inputs.release_tag }}
        run: ci/ci.sh attest build --out "$RUNNER_TEMP/image" --tag "$TAG"

      # 推后回读比对摘要、buildId 与字节，任一处不符即红：证明本身也要能被
      # 验证，否则它只是另一段自述。
      - name: Publish ISO provenance attestation
        if: success() && inputs.release_tag != '' && !inputs.acceptance
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: ci/ci.sh attest publish --out "$RUNNER_TEMP/image" --tag "$TAG" --token "$GHCR_TOKEN" ${{ inputs.replace && '--force' || '' }}

      # 清单只由产物推出：ISO 实测摘要对账本、build 对发行包 NEVRA，任一
      # 不等即不产出（生成器退 1，本步红）。放在发布之后是因为账本由
      # iso-publish 写出——提前生成等于给未经账本自证的字节发摘要。
      - name: Download release rpms
        if: success() && inputs.release_tag != '' && !inputs.acceptance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airymaxos-release-rpms
          path: ${{ runner.temp }}/relch
          merge-multiple: true

      - name: Generate release channel manifest
        if: success() && inputs.release_tag != '' && !inputs.acceptance
        env:
          TAG: ${{ inputs.release_tag }}
        run: ci/ci.sh release-channel --out "$RUNNER_TEMP/image" --rpm-dir "$RUNNER_TEMP/relch" --version "${TAG#v}"

      # 收集规则属于判据：写进 YAML 就只能在云端验一次、也只能在云端改。
      # 交给门禁后，同一段收集逻辑可以对着旧产物本地复算，缺项还被逐条
      # 写进 evidence-missing.txt（此前手写 glob 的两份清单已开始不一致）。
      # 三条腿各给一个 --dir：腿目录缺失（前腿失败、后续腿被跳过）本身
      # 就是证据的一部分，按四件套全缺登记，不影响其余腿入包。
      - name: Collect acceptance evidence
        if: always()
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: ci/ci.sh evidence --out "$RUNNER_TEMP/evidence" --dir "$RUNNER_TEMP/install-usb" --dir "$RUNNER_TEMP/install-bios" --dir "$RUNNER_TEMP/install-uefi" --extra "$RUNNER_TEMP/image/desktop/iso/iso-oci.txt" --extra "$RUNNER_TEMP/image/channel.json"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: airymaxos-acceptance
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: warn
