# ===========================================================================
# agent-linux (AirymaxOS) Airymax-Specific CI Pipeline
# 专门验证 Airymax 专属代码（security/airy + kernel/superv + corekern 等）
# 重组为 2 jobs：airy-build（airy_defconfig 4 架构构建 + 配置/产物/符号门禁）
#                airy-static（checkpatch + 定制扩展规则 + SPDX 许可证审计
#                             + defconfig 构建矩阵一致性）
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
# Constraint: 管理仓每个 workflow 最多 2 条流水线
# Rules: OS-STD-TOOL-160（checkpatch）/ OS-STD-TOOL-161（矩阵）
#        OS-BUILD-026 / OS-BUILD-028（defconfig 基线 / 每架构 defconfig）
#        IRON-3（所有 Airymax 增强代码必须在新增目录中）
# ===========================================================================

name: ci-airy
on:
  pull_request:
    paths:
      - 'kernel/security/airy/**'
      - 'kernel/kernel/superv/**'
      - 'kernel/kernel/syscalls/**'
      - 'kernel/kernel/corekern/**'
      - 'kernel/kernel/log/**'
      - 'kernel/kernel/ipc/**'
      - 'kernel/include/uapi/linux/airymax/**'
      - 'kernel/arch/*/configs/airy_defconfig'
      - 'kernel'
      - 'tools/defconfig-matrix/**'
      - '.github/workflows/ci-airy.yml'
  push:
    branches: [main]
    paths:
      - 'kernel/security/airy/**'
      - 'kernel/kernel/superv/**'
      - 'kernel/kernel/syscalls/**'
      - 'kernel/kernel/corekern/**'
      - 'kernel/kernel/log/**'
      - 'kernel/kernel/ipc/**'
      - 'kernel/include/uapi/linux/airymax/**'
      - 'kernel/arch/*/configs/airy_defconfig'
      - 'kernel'
      - 'tools/defconfig-matrix/**'
      - '.github/workflows/ci-airy.yml'

jobs:
  airy-build:
    name: airy_defconfig build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # kdir 是 $ARCH 映射后的内核源码架构目录名（x86_64 -> x86）
          - arch: x86_64
            kdir: x86
            cross: ""
          - arch: arm64
            kdir: arm64
            cross: "aarch64-linux-gnu-"
          - arch: riscv
            kdir: riscv
            cross: "riscv64-linux-gnu-"
          - arch: loongarch
            kdir: loongarch
            cross: "loongarch64-linux-gnu-"
    env:
      CROSS_COMPILE: ${{ matrix.cross }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install build dependencies and cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y flex bison libelf-dev libssl-dev bc cpio
          case "${{ matrix.arch }}" in
            x86_64) ;;
            arm64)     sudo apt-get install -y gcc-aarch64-linux-gnu ;;
            riscv)     sudo apt-get install -y gcc-riscv64-linux-gnu ;;
            loongarch)
              # noble 仅提供带版本号的 loongarch64 交叉 gcc，而 CROSS_COMPILE
              # 期望无版本号的驱动名，这里补齐该别名。
              sudo apt-get install -y gcc-13-loongarch64-linux-gnu
              sudo ln -sf "$(command -v loongarch64-linux-gnu-gcc-13)" \
                /usr/local/bin/loongarch64-linux-gnu-gcc
              ;;
          esac
      - name: Configure airy_defconfig
        run: |
          set -euo pipefail
          cd kernel
          make ARCH=${{ matrix.arch }} defconfig
          ./scripts/kconfig/merge_config.sh -m .config \
            arch/${{ matrix.kdir }}/configs/airy_defconfig
          make ARCH=${{ matrix.arch }} olddefconfig
      - name: Verify Airymax CONFIGs are enabled
        run: |
          set -euo pipefail
          cd kernel
          required=(
            'CONFIG_SECURITY=y'
            'CONFIG_SECURITY_AIRY=y'
            'CONFIG_AIRY_SYSCALL=y'
            'CONFIG_AIRY_COREKERN=y'
            'CONFIG_AIRY_LOG=y'
            'CONFIG_AIRY_IPC=y'
            'CONFIG_AIRY_CAP_TABLE_SIZE=1024'
            'CONFIG_IO_URING=y'
          )
          for want in "${required[@]}"; do
            grep -qx "$want" .config || {
              echo "::error::missing $want in airy_defconfig output"
              exit 1
            }
          done
          lsm="$(sed -n 's/^CONFIG_LSM="\(.*\)"$/\1/p' .config)"
          case ",${lsm}," in
            *,airy,*) echo "OK: airy present in CONFIG_LSM=${lsm}" ;;
            *)
              echo "::error::airy missing from CONFIG_LSM=${lsm}"
              exit 1
              ;;
          esac
      - name: Build kernel with airy_defconfig
        run: |
          set -euo pipefail
          cd kernel
          make ARCH=${{ matrix.arch }} -j"$(nproc)" 2>&1 | tee build.log
          if grep -E "error:" build.log; then
            echo "::error::build emitted compiler errors"
            exit 1
          fi
          airy_re='security/airy/|kernel/(superv|syscalls|corekern|log|ipc)/|/airymax/'
          if grep -E "warning:" build.log > warnings.log; then
            if grep -E "${airy_re}" warnings.log; then
              echo "::error::Airymax code emitted compiler warnings"
              exit 1
            fi
            echo "NOTE: upstream warnings present, none in Airymax paths"
          else
            echo "OK: no compiler warnings emitted"
          fi
      - name: Verify Airymax build artifacts
        run: |
          set -euo pipefail
          cd kernel
          for a in security/airy/built-in.a \
                   kernel/superv/built-in.a \
                   kernel/syscalls/built-in.a \
                   kernel/corekern/built-in.a \
                   kernel/log/built-in.a \
                   kernel/ipc/built-in.a; do
            test -f "$a" || { echo "::error::missing artifact $a"; exit 1; }
          done
          echo "All Airymax build artifacts verified"
      - name: Verify symbol integrity (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          cd kernel
          objs=(security/airy/airy_cap_check.o
                kernel/superv/airy_cap_check_superv.o)
          for o in "${objs[@]}"; do
            test -f "$o" || { echo "::error::missing object $o"; exit 1; }
          done
          # security/airy 与 kernel/superv 的全局符号必须互不冲突
          # （重命名后 *_superv 变体不得与宿主模块同名导出）
          nm -g --defined-only "${objs[0]}" | awk '{print $3}' | sort -u > a.sym
          nm -g --defined-only "${objs[1]}" | awk '{print $3}' | sort -u > b.sym
          if comm -12 a.sym b.sym | grep -q .; then
            echo "::error::clashing global symbols between the two objects:"
            comm -12 a.sym b.sym
            exit 1
          fi
          echo "Symbol integrity verified: no clashes between the two objects"

  airy-static:
    name: Airymax style and SPDX audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Run checkpatch.pl on Airymax-specific files
        run: |
          set -uo pipefail
          cd kernel
          dirs=(
            security/airy
            kernel/superv
            kernel/syscalls
            kernel/corekern
            kernel/log
            kernel/ipc
            include/uapi/linux/airymax
            include/airymax
          )
          mapfile -t files < <(
            find "${dirs[@]}" -type f \( -name '*.c' -o -name '*.h' \) |
              LC_ALL=C sort
          )
          echo "checkpatch targets: ${#files[@]} files"
          # checkpatch 在 --strict 下只要有 ERROR/WARNING/CHECK 就返回 1，
          # 因此门禁不能依赖退出码，必须解析 total 行中的 errors 计数。
          # 定级：ERROR 阻断，WARNING/CHECK 仅报告（L-11 归一化）。
          err_total=0
          warn_total=0
          chk_total=0
          for f in "${files[@]}"; do
            out="$(LC_ALL=C scripts/checkpatch.pl --strict --no-tree -f "$f" 2>&1 || true)"
            total="$(printf '%s\n' "$out" | grep -m1 '^total:' || true)"
            errs="$(printf '%s\n' "$total" | sed -n 's/^total: \([0-9]\{1,\}\) errors.*/\1/p')"
            warns="$(printf '%s\n' "$total" | sed -n 's/.*, \([0-9]\{1,\}\) warnings.*/\1/p')"
            chks="$(printf '%s\n' "$total" | sed -n 's/.*, \([0-9]\{1,\}\) checks.*/\1/p')"
            err_total=$((err_total + ${errs:-0}))
            warn_total=$((warn_total + ${warns:-0}))
            chk_total=$((chk_total + ${chks:-0}))
            if [ "${errs:-0}" -gt 0 ]; then
              echo "::error file=$f::checkpatch reported ${errs} errors"
              printf '%s\n' "$out" | grep '^ERROR:'
            fi
          done
          echo "checkpatch totals: ${err_total} errors, ${warn_total} warnings, ${chk_total} checks"
          if [ "$err_total" -gt 0 ]; then
            echo "::error::checkpatch gate failed (${err_total} errors)"
            exit 1
          fi
          echo "checkpatch gate passed (ERROR level only; warnings are reported)"
      - name: Run Airymax custom checkpatch extension rules
        run: |
          set -uo pipefail
          # 上游 checkpatch.pl 之上的 AirymaxOS 子系统架构约束
          # （AIRY-CHECKPATCH-001~011）。规则逻辑唯一落在
          # kernel/scripts/airy_checkpatch_ext.pl，与 tools/airy-checkpatch/
          # 的 pytest 集成套件同源，避免两处漂移（OS-TEST-066 / OS-KER-120）。
          # 引擎仅在 error 级别非零退出：ERROR 阻断，WARNING 报告。
          LC_ALL=C perl kernel/scripts/airy_checkpatch_ext.pl
      - name: Verify SPDX identifiers on Airymax-specific files
        shell: bash
        run: |
          set -uo pipefail
          cd kernel
          fail=0
          # 期望值依据 docs/docs-linux/50-engineering-standards/05-development-process.md
          # Part IV：UAPI/[SC] 头 -> Linux-syscall-note；内核态 .c/.h -> GPL-2.0-only；
          # 构建脚本 Kbuild -> GPL-2.0。
          check_spdx() {
            local expected="$1"
            shift
            local f
            for f in "$@"; do
              if ! head -1 "$f" | grep -qF "SPDX-License-Identifier: ${expected}"; then
                echo "::error file=$f::must declare 'SPDX-License-Identifier: ${expected}'"
                fail=1
              fi
            done
          }
          mapfile -t uapi_h < <(find include/uapi/linux/airymax -maxdepth 1 -name '*.h')
          mapfile -t airy_c < <(
            find security/airy kernel/superv kernel/syscalls kernel/corekern \
              kernel/log kernel/ipc -type f -name '*.c'
          )
          mapfile -t airy_h < <(
            find security/airy kernel/superv kernel/syscalls kernel/corekern \
              kernel/log kernel/ipc include/airymax -type f -name '*.h'
          )
          mapfile -t kbuild < <(
            find security/airy kernel/superv kernel/syscalls kernel/corekern \
              kernel/log kernel/ipc -type f -name 'Kbuild'
          )
          check_spdx 'GPL-2.0-only WITH Linux-syscall-note' "${uapi_h[@]}"
          check_spdx 'GPL-2.0-only' "${airy_c[@]}"
          check_spdx 'GPL-2.0-only' "${airy_h[@]}"
          check_spdx 'GPL-2.0-only' "${kbuild[@]}"
          check_spdx 'GPL-2.0' include/uapi/linux/airymax/Kbuild
          echo "SPDX audit: ${#uapi_h[@]} uapi headers, ${#airy_c[@]} .c, ${#airy_h[@]} .h, ${#kbuild[@]} Kbuild"
          if [ "$fail" -ne 0 ]; then
            echo "::error::SPDX audit failed"
            exit 1
          fi
          echo "SPDX audit passed"
      - name: Verify defconfig build matrix (SSoT manifest)
        run: |
          set -uo pipefail
          # manifest.yaml 是架构 / 必备 CONFIG / LSM / CI 构建矩阵的唯一事实源，
          # defconfig_matrix.py --check 对其做 8 项交叉校验：清单↔文件系统双向
          # 一致、defconfig 头部格式、必备 CONFIG、CONFIG_LSM、CI 矩阵架构同步、
          # CI required=() 同步、Kconfig 声明闭合（OS-BUILD-026 / OS-BUILD-028）。
          python3 -c 'import yaml' 2>/dev/null || \
            python3 -m pip install --quiet 'pyyaml>=6.0,<7.0'
          python3 tools/defconfig-matrix/defconfig_matrix.py --check