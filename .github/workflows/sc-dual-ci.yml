# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# [SC] 共享契约层双向 CI（OS-IRON-008）（2 jobs：验证 + 触发 agentrt）
# ===========================================================================
# Authority: docs/docs-linux/70-build-system/03-ci-cd-pipeline.md
# Design: L1/L3 审查改为 GitHub 分支保护规则，不在 CI 中执行
# ===========================================================================

name: sc-dual-ci
on:
  pull_request:
    paths:
      - 'kernel/include/uapi/linux/airymax/error.h'
      - 'kernel/include/uapi/linux/airymax/log_types.h'
      - 'kernel/include/uapi/linux/airymax/ipc.h'
      - 'kernel/include/uapi/linux/airymax/sched.h'
      - 'kernel/include/uapi/linux/airymax/memory_types.h'
      - 'kernel/include/uapi/linux/airymax/security_types.h'
      - 'kernel/include/uapi/linux/airymax/cognition_types.h'
      - 'kernel/include/uapi/linux/airymax/syscalls.h'
      - 'kernel/include/uapi/linux/airymax/uapi_compat.h'
      - 'kernel/include/uapi/linux/airymax/lsm_types.h'
      - 'kernel/include/uapi/linux/airymax/bpf_struct_ops.h'
      - 'kernel/include/uapi/linux/airymax/syscall_gen.h'

jobs:
  # ─── Job 1: [SC] 头文件验证（agent-linux 侧） ────────────────────
  # 合并原 kernel-ci 的 12 头文件验证部分
  sc-validate:
    name: "[SC] Header Validation (agent-linux side)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Verify [SC] 12 shared headers (OS-IRON-014)
        run: |
          set -e
          for h in error.h log_types.h ipc.h sched.h memory_types.h \
                   security_types.h cognition_types.h syscalls.h syscall_gen.h \
                   uapi_compat.h lsm_types.h bpf_struct_ops.h; do
            test -f "kernel/include/uapi/linux/airymax/$h" || { echo "FAIL: $h missing"; exit 1; }
            echo "OK: $h present"
          done

      - name: Verify no physical duplicates (OS-IRON-014)
        run: |
          set -e
          # [SC] ipc.h 应仅有一个物理副本（kernel/include/uapi/linux/airymax/）。
          # 注意：kernel 子模块是完整 Linux 6.6 内核树，本身含多个标准
          # ipc.h（linux/ipc.h、apparmor、selftests 等），因此 find 必须
          # 限定到 airymax/ 路径，否则计数恒 >1 导致检查永远失败。
          COUNT=$(find . -path './.git' -prune -o -path '*/airymax/ipc.h' -print | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: airymax/ipc.h has $COUNT copies (expected 1)"
            find . -path './.git' -prune -o -path '*/airymax/ipc.h' -print
            exit 1
          fi
          echo "OK: no physical duplicates of [SC] ipc.h"

      - name: Byte-level [SC] header consistency check (normalized diff)
        run: |
          set -e
          # IRON-9 v3: kernel-side and commons-side [SC] headers must be
          # content-identical. Two regions are legitimately per-side and
          # are normalized away before the byte comparison:
          #   1. SPDX 许可头（kernel: GPL-2.0-only WITH Linux-syscall-note；
          #      commons: BSD-3-Clause OR GPL-2.0 —— 2026-08-14 决策保留各自许可）
          #   2. include 前缀（kernel: <linux/airymax/...>；commons: <airymax/...>）
          # 其余内容必须逐字节一致（含字段名/布局/注释文本/空白格式）。
          norm_sc_header() {
            grep -v '^/\* SPDX-' "$1" \
              | grep -v '^ \* Copyright (c)' \
              | sed 's|<linux/airymax/|<airymax/|g'
          }
          # Clone agentrt commons for comparison; skip if unavailable.
          git clone --depth 1 https://atomgit.com/openairymax/agentrt.git /tmp/agentrt 2>/dev/null || {
            echo "WARN: Cannot clone agentrt repo, skipping byte-level comparison"
            exit 0
          }

          FAIL=0
          for h in error.h log_types.h ipc.h sched.h memory_types.h \
                   security_types.h cognition_types.h syscalls.h syscall_gen.h \
                   uapi_compat.h lsm_types.h bpf_struct_ops.h; do
            kern="kernel/include/uapi/linux/airymax/$h"
            comm="/tmp/agentrt/commons/include/airymax/$h"

            if [ ! -f "$comm" ]; then
              echo "WARN: $h not found in commons"
              continue
            fi

            if ! diff <(norm_sc_header "$kern") <(norm_sc_header "$comm") > /dev/null 2>&1; then
              echo "FAIL: $h differs between kernel and commons (normalized)"
              diff <(norm_sc_header "$kern") <(norm_sc_header "$comm") || true
              FAIL=1
            else
              echo "OK: $h content-identical (after SPDX/include-prefix normalization)"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "FAIL: [SC] header consistency check failed"
            exit 1
          fi

      - name: Run kernel CI for [SC] changes (deferred to kernel submodule)
        run: |
          echo "[SC] header changes detected"
          echo "Kernel CI is now handled by kernel submodule .github/workflows/"
          echo "This job validates [SC] layer integrity only"

  # ─── Job 2: 触发 agentrt 镜像 PR + 等待 CI ──────────────────────────
  # 合并原 trigger-agentrt-mirror-pr + await-agentrt-ci
  sc-trigger-and-await:
    name: "[SC] Trigger & Await agentrt Mirror CI"
    runs-on: ubuntu-latest
    needs: sc-validate
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Create mirror PR in agentrt repo
        env:
          AGENTRT_TOKEN: ${{ secrets.AGENTRT_CI_TOKEN }}
        run: |
          # 导出 12 头文件变更补丁
          git format-patch origin/${{ github.base_ref }} HEAD -- \
            kernel/include/uapi/linux/airymax/ -o /tmp/patches
          # 在 agentrt 仓创建镜像 PR
          python3 tools/create-agentrt-mirror-pr.py \
            --patches /tmp/patches \
            --source-pr ${{ github.event.pull_request.number }} \
            --token "$AGENTRT_TOKEN"

      - name: Poll agentrt mirror PR CI status
        env:
          AGENTRT_TOKEN: ${{ secrets.AGENTRT_CI_TOKEN }}
        run: |
          python3 tools/await-agentrt-ci.py \
            --source-pr ${{ github.event.pull_request.number }} \
            --timeout 30m \
            --token "$AGENTRT_TOKEN"

# L1/L3 审查通过 GitHub 分支保护规则强制（require-l1-l3-review 已移除）
# 分支保护配置：require_code_owner_reviews + required_reviewers: 2
