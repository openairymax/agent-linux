# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# SSoT 校验流水线（2 jobs：YAML 语法/规则 ID + 本仓文档交叉引用一致性）
# ===========================================================================
# Authority: docs/docs-linux/50-engineering-standards/09-ssot-registry.md
#            docs/docs-linux/70-build-system/03-ci-cd-pipeline.md §6
# Design: 管理仓只校验本仓自有 .md；file-integrity 与子仓编排见
#         mgmt-verify.yml
# ===========================================================================

name: ssot-verify
on:
  pull_request:
    branches: [main]
    # 与 push 侧同一份判据：判据本身（门禁脚本与本文件）也必须先过 PR，
    # 否则改坏校验器只能在合并后的 push 上暴露，评审阶段看不到结论。
    paths:
      - '**.md'
      - 'ssot-registry.yaml'
      - 'tools/validate-ssot.py'
      - 'ci/gates/ssot-verify.sh'
      - '.github/workflows/ssot-verify.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'ssot-registry.yaml'
      - 'tools/validate-ssot.py'
      - 'ci/gates/ssot-verify.sh'
      - '.github/workflows/ssot-verify.yml'

permissions:
  contents: read

# 同一 ref 只保留最新一轮：文档校验的结论只对产生它的那棵树有效。
concurrency:
  group: ssot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: SSoT YAML 语法 + 规则 ID 注册一致性 ─────────────────────
  # 合并原 doc-format 的 YAML 校验部分
  ssot-syntax-and-rules:
    name: SSoT YAML Syntax & Rule ID Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # YAML 语法 + 规则 ID 计数 + validate-ssot.py 三段判定收进
      # ci/gates/ssot-verify.sh。原先内联 heredoc 只在改动 .md / 注册表时
      # 于云端执行，本地无从复现；现在提交前可直接跑同一条命令。
      - name: Validate SSoT YAML syntax, rule count and registry (OS-IRON-015)
        run: ci/ci.sh ssot-verify --kind syntax

  # ─── Job 2: 本仓自有 .md 相对链接一致性 ─────────────────────────────
  # 仅扫描被 git 跟踪的本仓 .md；跨仓（../）与外链（http）交由各仓自检
  doc-links:
    name: Repo-Owned Markdown Link Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: ssot-syntax-and-rules
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }

      - name: Verify relative markdown links resolve
        run: ci/ci.sh ssot-verify --kind links
