# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# OS-CHK 统一门禁：编排 tools/ 下既有检查工具，按 P0/P1/P2 严重级阻断
# ===========================================================================
# Authority: docs/docs-linux/50-engineering-standards/05-development-process.md
#              Part III（OS-CHK 编号体系 §6 / 检查报告格式 §5.3）
# Design: tools/os-chk/os_chk.py 只做注册表解析、调度、汇总与门禁判定，
#         检查本体由既有执行器承担；gates.yaml 为门禁唯一事实源。
# ---------------------------------------------------------------------------
# 监听面按「受检对象」划定，而不是按子目录逐条枚举：os_chk.py 会调用 tools/
# 下的全部执行器，逐个列举曾漏掉 airy-qemu、sdk 与 security，新工具加入后
# 也不会自动纳入。四个 gitlink 各有受检对象——kernel 供 defconfig / BTF /
# kbuild 版本检查，system 供装机后启动契约的单测，distro 供 spec 与
# kickstart 规则，security 供 LSM 用例——指针一动即重跑。ci/** 与
# .github/workflows/** 是为了让门禁脚本和 workflow 自身也受门禁约束：此前
# 改 ci/gates/*.sh 不触发任何流水线，等于改动无人验证。
# 默认 --fail-on P1（P0+P1 阻断），对齐 05-development-process.md Part III。
# ===========================================================================

name: os-chk-verify
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'sdk/**'
      - 'ci/**'
      - 'ssot-registry.yaml'
      - '.gitmodules'
      - 'kernel'
      - 'system'
      - 'distro'
      - 'security'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'sdk/**'
      - 'ci/**'
      - 'ssot-registry.yaml'
      - '.gitmodules'
      - 'kernel'
      - 'system'
      - 'distro'
      - 'security'
      - '.github/workflows/**'

# 最小权限：本 workflow 全程只读，显式声明后不再依赖仓库默认设置。
permissions:
  contents: read

# 同一 ref 只保留最新一轮：新 push 让旧 run 的结论对当前树失效，
# 继续排队只会抢并发额度，并让排障读到旧 run 的日志。
concurrency:
  group: os-chk-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  os-chk-verify:
    name: OS-CHK Unified Gates
    # 全仓统一钉 24.04：门禁的判据必须随镜像固定，浮动标签会让同一份
    # 脚本在两次运行之间落到不同版本的工具链上。迁移前已用该镜像自带的
    # shellcheck 0.9.0 对 ci/ 全量预验，结果与本任务的历史基线一致。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive }

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # 先检查门禁自己：workflow 是否仍满足薄化约束、ci/ 下脚本能否被
      # bash -n 解析、shellcheck 是否过。门禁脚本的改动此前无人验证。
      # distro 子仓的规则与单测也在这里：lint.sh 末段转调 distro-lint 门禁，
      # 子仓改坏一条断言在本地一条命令就能发现，不必等到云端。同一份工作
      # 不在本文件里再单列一步，重复只会加长每轮耗时。
      - name: Lint gate scripts and workflows
        run: ci/ci.sh lint

      # K-21：入口、单元启动面与离线资产通道的 0/10/1 契约在同一处判定。
      # 配方漏交付单元这类缺口此前要打完镜像、装完系统才发现。
      - name: Local model asset channel gates
        run: ci/ci.sh model-manifest

      # K-22：探测输出的字段集合、后端顺序与证据前缀是对外契约，行式与
      # JSON 一旦漂移，监控与门禁的解析会静默失效——字符串还在，含义已变。
      - name: Accelerator probe output gates
        run: ci/ci.sh llm-accel

      # K-23：断网自检的退出码、逐项结论与阻塞语义，以及单元在缺清单时
      # 跳过启动的条件。自检给不出归因要等装机后才暴露，代价最高。
      - name: Offline self-test gates
        run: ci/ci.sh llm-offline

      # I-29：网络是装机验收的第一道门禁——网络不通时桌面、驱动、取证各项
      # 都退化成「无法判定」而不是「不合格」。这里的声明面不依赖镜像根，
      # 与 distro-lint 同源判定；实物面（--root）与联机面（--live）在装机
      # 后由验收脚本调用。
      - name: Network bring-up static gates
        run: ci/ci.sh net-online

      # I-25：屏幕背光与键盘背光是两条完全不同的通路，缺一条就只能靠外部
      # 工具猜设备名。本门禁在临时 sysfs 树上判「写进去与回读一致」的四种
      # 收场，不依赖真机，也不需要先打镜像。
      - name: Backlight entry gates
        run: ci/ci.sh backlight

      # I-26：驱动名只能说明内核绑上了显卡，说明不了屏能用——缺 EDID、缺
      # 模式、只剩未连接端口时 X 会在模式求交上失败，表现为「进了桌面但
      # 黑屏」。本门禁在临时 DRM 树上判三条判据、四种缺口与不适用收场。
      - name: Display capability gates
        run: ci/ci.sh desktop-capability

      # I-27：闭源库带 PT_GNU_STACK=RWE 时，W^X 会在 dlopen 阶段拒绝它。
      # 内核侧受理白名单需要 file_mprotect 钩子与可写策略通道，本版登记顺延，
      # 这里只钉住「交付链不许用清位或重编可执行栈绕过」，以及例外清单可出。
      - name: W^X bypass and inventory gates
        run: ci/ci.sh wx-policy

      # I-28：anaconda 在写入 RTC 时可能长时间无输出地停住。声明面判限时器
      # 已按顺序嵌入两个剖面且只告警不判负；取证面解析装机日志的打点块
      # （--log），装机后由验收脚本带着日志调用。
      - name: RTC write bound and trace gates
        run: ci/ci.sh rtc-probe

      # 依赖、pytest 与 os_chk.py --check 三步收进 ci/gates/python-verify.sh
      # 的 oschk 分支：此前 10 份依赖清单在本文件里各写一遍，本地无法复现，
      # 改动后只能在云端验证。现在 runner 与开发者跑的是同一条命令。
      - name: Install dependencies, run OS-CHK unit tests and unified gates
        run: ci/ci.sh python-verify --kind oschk
