# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# OS-CHK 统一门禁：编排 tools/ 下既有检查工具，按 P0/P1/P2 严重级阻断
# ===========================================================================
# Authority: docs/docs-linux/50-engineering-standards/05-development-process.md
#              Part III（OS-CHK 编号体系 §6 / 检查报告格式 §5.3）
# Design: tools/os-chk/os_chk.py 只做注册表解析、调度、汇总与门禁判定，
#         检查本体由既有执行器承担；gates.yaml 为门禁唯一事实源。
# ---------------------------------------------------------------------------
# 说明：os_chk.py 会依次调用 abi-check / sc-tri-compile / validate-ssot /
# codegen / dsl / check-copyright / airy-checkpatch / defconfig-matrix /
# btf-integration / kbuild-version / release-engineering 等既有工具，故本
# workflow 除监听 tools/os-chk/** 外，同时监听上述执行器与其受检对象的路径，
# 任一改动破坏门禁即可被捕获。默认 --fail-on P1（P0+P1 阻断），对齐规范。
# kernel 为本仓 gitlink，其子模块指针变动即触发（OS-TEST-066 的 Perl 引擎位于
# kernel/scripts/；OS-BUILD-MATRIX 的 defconfig 受检对象位于
# kernel/arch/*/configs/；OS-BUILD-BTF 的受检片段与其 CI 供给位于
# kernel/arch/*/configs/airy_defconfig 与 .github/workflows/；
# OS-BUILD-KBUILD-VERSION 的受检对象 kernel/Makefile.airymaxos 与
# kernel/Makefile 亦位于该 gitlink 内）。
# OS-BUILD-RELEASE 的受检对象为 tools/release-engineering/manifest.yaml 与
# .github/workflows/release.yml，故两者亦纳入监听。
# OS-BUILD-NIGHTLY 的受检对象为 tools/nightly/manifest.yaml 与
# .github/workflows/nightly.yml，故两者亦纳入监听。
# OS-BUILD-REPO-SCAFFOLD 的受检对象为 tools/repo-scaffold/manifest.yaml、
# .gitmodules 与八子仓检出目录，故 tools/repo-scaffold/** 与 .gitmodules
# 亦纳入监听。
# OS-OPS-ROLLBACK 的受检对象为 tools/airy-rollback/manifest.yaml 及其编排
# 器，故 tools/airy-rollback/** 亦纳入监听。
# OS-ACC-RT 验收工具 tools/osaccrt/ 以 pytest 单元测试作为 L0 门禁，其用例
# 落在 tools/osaccrt/tests/，故该目录亦纳入监听与测试清单。
# ===========================================================================

name: os-chk-verify
on:
  pull_request:
    paths:
      - 'tools/osaccrt/**'
      - 'tools/os-chk/**'
      - 'tools/check-copyright.py'
      - 'tools/validate-ssot.py'
      - 'tools/sc-tri-compile/**'
      - 'tools/abi-check/**'
      - 'tools/codegen/**'
      - 'tools/dsl/**'
      - 'tools/airy-checkpatch/**'
      - 'tools/defconfig-matrix/**'
      - 'tools/ci-matrix/**'
      - 'tools/btf-integration/**'
      - 'tools/kbuild-version/**'
      - 'tools/release-engineering/**'
      - '.github/workflows/release.yml'
      - 'tools/nightly/**'
      - '.github/workflows/nightly.yml'
      - 'tools/repo-scaffold/**'
      - 'tools/airy-rollback/**'
      - '.gitmodules'
      - 'ssot-registry.yaml'
      - 'kernel'
  push:
    branches: [main, develop]
    paths:
      - 'tools/osaccrt/**'
      - 'tools/os-chk/**'
      - 'tools/check-copyright.py'
      - 'tools/validate-ssot.py'
      - 'tools/sc-tri-compile/**'
      - 'tools/abi-check/**'
      - 'tools/codegen/**'
      - 'tools/dsl/**'
      - 'tools/airy-checkpatch/**'
      - 'tools/defconfig-matrix/**'
      - 'tools/ci-matrix/**'
      - 'tools/btf-integration/**'
      - 'tools/kbuild-version/**'
      - 'tools/release-engineering/**'
      - '.github/workflows/release.yml'
      - 'tools/nightly/**'
      - '.github/workflows/nightly.yml'
      - 'tools/repo-scaffold/**'
      - 'tools/airy-rollback/**'
      - '.gitmodules'
      - 'ssot-registry.yaml'
      - 'kernel'

jobs:
  os-chk-verify:
    name: OS-CHK Unified Gates
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OS-CHK dependencies
        run: |
          pip install -r tools/os-chk/requirements-dev.txt
          # OS-IRON-009-CODEGEN 与 OS-IRON-009-DSL 分别经 run_codegen.py /
          # dsl_compile.py 执行；dsl 单向复用 codegen 的确定性渲染环境
          # （codegen_io → Jinja2），故此处必须装齐 codegen 依赖，否则两门禁
          # 在 CI 恒为 ERROR（本地因已装 Jinja2 而不可见）。
          pip install -r tools/codegen/requirements-dev.txt
          pip install -r tools/defconfig-matrix/requirements-dev.txt
          pip install -r tools/ci-matrix/requirements-dev.txt
          pip install -r tools/btf-integration/requirements-dev.txt
          pip install -r tools/kbuild-version/requirements-dev.txt
          pip install -r tools/release-engineering/requirements-dev.txt
          pip install -r tools/nightly/requirements-dev.txt
          pip install -r tools/repo-scaffold/requirements-dev.txt
          pip install -r tools/airy-rollback/requirements-dev.txt

      - name: Run OS-CHK unit tests (pytest)
        run: |
          python3 -m pytest \
            tools/os-chk/tests/ tools/airy-checkpatch/tests/ \
            tools/defconfig-matrix/tests/ tools/ci-matrix/tests/ \
            tools/btf-integration/tests/ tools/kbuild-version/tests/ \
            tools/release-engineering/tests/ tools/nightly/tests/ \
            tools/repo-scaffold/tests/ tools/airy-rollback/tests/ \
            tools/osaccrt/tests/ -q

      - name: Run OS-CHK unified gates
        run: |
          if ! python3 tools/os-chk/os_chk.py --check; then
            echo "::error::OS-CHK gates failed (P0/P1 blocking)."
            echo "::error::Run 'python3 tools/os-chk/os_chk.py --verbose' locally."
            exit 1
          fi
          echo "::notice::All OS-CHK gates passed."
