# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# OS-CHK 统一门禁：编排 tools/ 下既有检查工具，按 P0/P1/P2 严重级阻断
# ===========================================================================
# Authority: docs/docs-linux/50-engineering-standards/05-development-process.md
#              Part III（OS-CHK 编号体系 §6 / 检查报告格式 §5.3）
# Design: tools/os-chk/os_chk.py 只做注册表解析、调度、汇总与门禁判定，
#         检查本体由既有执行器承担；gates.yaml 为门禁唯一事实源。
# ---------------------------------------------------------------------------
# 说明：os_chk.py 会依次调用 abi-check / sc-tri-compile / validate-ssot /
# codegen / dsl / check-copyright / airy-checkpatch / defconfig-matrix /
# btf-integration / kbuild-version / release-engineering 等既有工具，故本
# workflow 除监听 tools/os-chk/** 外，同时监听上述执行器与其受检对象的路径，
# 任一改动破坏门禁即可被捕获。默认 --fail-on P1（P0+P1 阻断），对齐规范。
# kernel 为本仓 gitlink，其子模块指针变动即触发（OS-TEST-066 的 Perl 引擎位于
# kernel/scripts/；OS-BUILD-MATRIX 的 defconfig 受检对象位于
# kernel/arch/*/configs/；OS-BUILD-BTF 的受检片段与其 CI 供给位于
# kernel/arch/*/configs/airy_defconfig 与 .github/workflows/；
# OS-BUILD-KBUILD-VERSION 的受检对象 kernel/Makefile.airymaxos 与
# kernel/Makefile 亦位于该 gitlink 内）。
# OS-BUILD-RELEASE 的受检对象为 tools/release-engineering/manifest.yaml 与
# .github/workflows/release.yml，故两者亦纳入监听。
# OS-BUILD-NIGHTLY 的受检对象为 tools/nightly/manifest.yaml 与
# .github/workflows/nightly.yml，故两者亦纳入监听。
# OS-BUILD-REPO-SCAFFOLD 的受检对象为 tools/repo-scaffold/manifest.yaml、
# .gitmodules 与八子仓检出目录，故 tools/repo-scaffold/** 与 .gitmodules
# 亦纳入监听。
# OS-OPS-ROLLBACK 的受检对象为 tools/airy-rollback/manifest.yaml 及其编排
# 器，故 tools/airy-rollback/** 亦纳入监听。
# OS-ACC-RT 验收工具 tools/osaccrt/ 以 pytest 单元测试作为 L0 门禁，其用例
# 落在 tools/osaccrt/tests/，故该目录亦纳入监听与测试清单。
# 烧录工具 tools/airy-flash/ 与上述工具共用同一套 Python 测试环境，用例同样
# 挂在 --kind oschk 下执行，避免再开一条只装 pytest 的流水线。
# 门禁实现自身（ci/）与 system 子仓此前不在任何 workflow 的 paths 里：改
# ci/gates/*.sh 或 ci/ci.sh 不会触发任何流水线，等于门禁改动无人验证。system
# 的单元测试自 0.0.3 起挂在本 kind 下，其指针变动必须重跑。故 ci/**、system
# 与本 workflow 自身纳入监听，并在 job 内先跑 ci/lint.sh（workflow 薄化约束
# ＋ bash 语法 ＋ shellcheck），让门禁脚本的改动由门禁自己把关。
# distro 子仓同理：spec / kickstart / 组件清单的规则与工具单测只在组装镜像
# 时才跑，子仓内改坏一条断言不会触发任何流水线。故 distro gitlink 纳入监听，
# 由 ci/ci.sh distro-lint 调用子仓自己的 run-lint.sh。
# ===========================================================================

name: os-chk-verify
on:
  pull_request:
    paths:
      - 'tools/osaccrt/**'
      - 'tools/os-chk/**'
      - 'tools/check-copyright.py'
      - 'tools/validate-ssot.py'
      - 'tools/sc-tri-compile/**'
      - 'tools/abi-check/**'
      - 'tools/codegen/**'
      - 'tools/dsl/**'
      - 'tools/airy-checkpatch/**'
      - 'tools/defconfig-matrix/**'
      - 'tools/ci-matrix/**'
      - 'tools/btf-integration/**'
      - 'tools/kbuild-version/**'
      - 'tools/release-engineering/**'
      - '.github/workflows/release.yml'
      - 'tools/nightly/**'
      - '.github/workflows/nightly.yml'
      - 'tools/repo-scaffold/**'
      - 'tools/airy-rollback/**'
      - 'tools/airy-flash/**'
      - '.gitmodules'
      - 'ssot-registry.yaml'
      - 'kernel'
      - 'system'
      - 'distro'
      - 'ci/**'
      - '.github/workflows/os-chk-verify.yml'
  push:
    branches: [main, develop]
    paths:
      - 'tools/osaccrt/**'
      - 'tools/os-chk/**'
      - 'tools/check-copyright.py'
      - 'tools/validate-ssot.py'
      - 'tools/sc-tri-compile/**'
      - 'tools/abi-check/**'
      - 'tools/codegen/**'
      - 'tools/dsl/**'
      - 'tools/airy-checkpatch/**'
      - 'tools/defconfig-matrix/**'
      - 'tools/ci-matrix/**'
      - 'tools/btf-integration/**'
      - 'tools/kbuild-version/**'
      - 'tools/release-engineering/**'
      - '.github/workflows/release.yml'
      - 'tools/nightly/**'
      - '.github/workflows/nightly.yml'
      - 'tools/repo-scaffold/**'
      - 'tools/airy-rollback/**'
      - 'tools/airy-flash/**'
      - '.gitmodules'
      - 'ssot-registry.yaml'
      - 'kernel'
      - 'system'
      - 'distro'
      - 'ci/**'
      - '.github/workflows/os-chk-verify.yml'

jobs:
  os-chk-verify:
    name: OS-CHK Unified Gates
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 先检查门禁自己：workflow 是否仍满足薄化约束、ci/ 下脚本能否被
      # bash -n 解析、shellcheck 是否过。门禁脚本的改动此前无人验证。
      - name: Lint gate scripts and workflows
        run: ci/lint.sh

      # distro 子仓的规则与单测此前只在本地手动执行：子仓内改坏一条断言
      # 不触发任何流水线，要等下一次组装镜像才暴露。入口交给子仓自己的
      # run-lint.sh，本层不复制检查项。
      - name: Distro submodule static gates
        run: ci/ci.sh distro-lint

      # 依赖、pytest 与 os_chk.py --check 三步收进 ci/gates/python-verify.sh
      # 的 oschk 分支：此前 10 份依赖清单在本文件里各写一遍，本地无法复现，
      # 改动后只能在云端验证。现在 runner 与开发者跑的是同一条命令。
      - name: Install dependencies, run OS-CHK unit tests and unified gates
        run: ci/ci.sh python-verify --kind oschk
