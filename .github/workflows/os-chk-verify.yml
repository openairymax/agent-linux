# ===========================================================================
# agent-linux (AirymaxOS) CI Pipeline
# OS-CHK 统一门禁：编排 tools/ 下既有检查工具，按 P0/P1/P2 严重级阻断
# ===========================================================================
# Authority: docs/docs-linux/50-engineering-standards/05-development-process.md
#              Part III（OS-CHK 编号体系 §6 / 检查报告格式 §5.3）
# Design: tools/os-chk/os_chk.py 只做注册表解析、调度、汇总与门禁判定，
#         检查本体由既有执行器承担；gates.yaml 为门禁唯一事实源。
# ---------------------------------------------------------------------------
# 监听面按「受检对象」划定，而不是按子目录逐条枚举：os_chk.py 会调用 tools/
# 下的全部执行器，逐个列举曾漏掉 airy-qemu、sdk 与 security，新工具加入后
# 也不会自动纳入。四个 gitlink 各有受检对象——kernel 供 defconfig / BTF /
# kbuild 版本检查，system 供装机后启动契约的单测，distro 供 spec 与
# kickstart 规则，security 供 LSM 用例——指针一动即重跑。ci/** 与
# .github/workflows/** 是为了让门禁脚本和 workflow 自身也受门禁约束：此前
# 改 ci/gates/*.sh 不触发任何流水线，等于改动无人验证。
# 默认 --fail-on P1（P0+P1 阻断），对齐 05-development-process.md Part III。
# ===========================================================================

name: os-chk-verify
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'sdk/**'
      - 'ci/**'
      - 'ssot-registry.yaml'
      - '.gitmodules'
      - 'kernel'
      - 'system'
      - 'distro'
      - 'security'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'sdk/**'
      - 'ci/**'
      - 'ssot-registry.yaml'
      - '.gitmodules'
      - 'kernel'
      - 'system'
      - 'distro'
      - 'security'
      - '.github/workflows/**'

# 最小权限：本 workflow 全程只读，显式声明后不再依赖仓库默认设置。
permissions:
  contents: read

# 同一 ref 只保留最新一轮：新 push 让旧 run 的结论对当前树失效，
# 继续排队只会抢并发额度，并让排障读到旧 run 的日志。
concurrency:
  group: os-chk-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  os-chk-verify:
    name: OS-CHK Unified Gates
    # 全仓唯一的 22.04 例外：本 job 的 lint 门禁以镜像自带的 shellcheck 版本
    # 作为基线，换镜像等于换基线，必须在能本地复算该版本结论时再迁移。
    # 其余 workflow 已统一固定 24.04，不再使用浮动的 ubuntu-latest。
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 先检查门禁自己：workflow 是否仍满足薄化约束、ci/ 下脚本能否被
      # bash -n 解析、shellcheck 是否过。门禁脚本的改动此前无人验证。
      - name: Lint gate scripts and workflows
        run: ci/ci.sh lint

      # distro 子仓的规则与单测此前只在本地手动执行：子仓内改坏一条断言
      # 不触发任何流水线，要等下一次组装镜像才暴露。入口交给子仓自己的
      # run-lint.sh，本层不复制检查项。
      - name: Distro submodule static gates
        run: ci/ci.sh distro-lint

      # 依赖、pytest 与 os_chk.py --check 三步收进 ci/gates/python-verify.sh
      # 的 oschk 分支：此前 10 份依赖清单在本文件里各写一遍，本地无法复现，
      # 改动后只能在云端验证。现在 runner 与开发者跑的是同一条命令。
      - name: Install dependencies, run OS-CHK unit tests and unified gates
        run: ci/ci.sh python-verify --kind oschk
