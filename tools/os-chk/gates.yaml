# AirymaxOS OS-CHK 门禁注册表
# Copyright (c) 2025-2026 SPHARX Ltd. All Rights Reserved.
#
# 权威依据：
#   docs/docs-linux/50-engineering-standards/05-development-process.md
#     Part III 规范符合性检查（OS-CHK-* 编号体系、§5.1 检查流水线、§5.3 报告格式）
#   docs/docs-linux/70-build-system/03-ci-cd-pipeline.md（门禁定义）
#
# 铁律：本表只登记「存在真实可执行器」的门禁。执行器为既有 tools/ 下的
#      检查工具，以子进程方式调用；严禁登记 raise NotImplementedError 之类
#      的占位项，亦严禁在此重复实现检查逻辑（避免与工具本体漂移）。
#      需要新增门禁时，先落地其执行器工具，再在此登记。
#
# 字段：
#   id        门禁编号（OS-CHK-* / OS-IRON-* / 工具门禁标识），全局唯一
#   name      门禁名称（简短，用于报告）
#   severity  严重级：P0 / P1 / P2（P0 最高）
#   category  类别：doc / code / iron / build
#   authority 规则权威出处（文档路径 §章节）
#   executor.argv  执行器命令行（相对仓库根；argv[0] 需在 PATH 中）
#   timeout_s 超时秒数（可选，默认 600）
#
# 严格 schema：门禁与 executor 层出现未登记字段将被 os_chk.py 判为非法，
# 以防字段错位（如把 timeout_s 误缩进到 executor 下）被静默忽略。
#
# version: 注册表版本，随门禁增删而递增。

version: "1.6.0"

gates:
  # ── 文档类 ────────────────────────────────────────────────────────────
  - id: OS-CHK-DOC-01
    name: Copyright 头部
    severity: P0
    category: doc
    authority: 05-development-process.md §6.1
    executor:
      argv: ["python3", "tools/check-copyright.py", "--root", "."]

  # ── [SC] 契约层（DOC-04 头文件清单一致 / IRON-01 共享契约层一致）──────
  - id: OS-CHK-DOC-04
    name: "[SC] 头文件清单一致性"
    severity: P0
    category: iron
    authority: 05-development-process.md §6.1 / §6.3
    executor:
      argv: ["python3", "tools/sc-tri-compile/sc_tri_compile.py", "--check"]

  # ── 内核 ABI（OS-IRON-001 用户空间 ABI 永不破坏）─────────────────────
  - id: OS-IRON-001
    name: syscall ABI 稳定性
    severity: P0
    category: iron
    authority: 07-syscall-registry.md §1（OS-IRON-001）
    executor:
      argv: ["python3", "tools/abi-check/abi_check.py", "--check"]

  # ── SSoT 规则 ID 注册一致性（OS-IRON-015）────────────────────────────
  - id: OS-IRON-015
    name: SSoT 规则 ID 注册一致性
    severity: P0
    category: doc
    authority: 09-ssot-registry.md（OS-IRON-015）
    executor:
      argv: ["python3", "tools/validate-ssot.py", ".", "ssot-registry.yaml"]

  # ── IRON-9 生成产物零漂移（codegen / DSL 决策表）─────────────────────
  - id: OS-IRON-009-CODEGEN
    name: codegen 生成产物零漂移
    severity: P0
    category: build
    authority: 30-interfaces/06-codegen-pipeline.md §6.3（IRON-9）
    executor:
      argv: ["python3", "tools/codegen/run_codegen.py", "--check"]

  - id: OS-IRON-009-DSL
    name: 策略 DSL 决策表零漂移
    severity: P0
    category: build
    authority: 30-interfaces/06-codegen-pipeline.md §7.2（IRON-9）
    executor:
      argv: ["python3", "tools/dsl/dsl_compile.py", "--check"]

  # ── Airymax 定制 checkpatch 扩展规则（OS-TEST-066 / OS-KER-120）──────
  - id: OS-TEST-066
    name: Airymax 定制 checkpatch 扩展规则
    severity: P0
    category: code
    authority: 80-testing/05-static-analysis.md §7.2（OS-TEST-066 / OS-KER-120）
    timeout_s: 300
    executor:
      argv: ["perl", "kernel/scripts/airy_checkpatch_ext.pl"]

  # ── defconfig 构建矩阵一致性（OS-BUILD-026 / OS-BUILD-028）────────────
  - id: OS-BUILD-MATRIX
    name: defconfig 构建矩阵一致性
    severity: P0
    category: build
    authority: 70-build-system/02-kconfig-system.md §10（OS-BUILD-026/028）
    executor:
      argv: ["python3", "tools/defconfig-matrix/defconfig_matrix.py", "--check"]

  # ── CI 编译矩阵一致性（OS-STD-TOOL-161 / OS-STD-TEST-011）─────────────
  # 受检对象为 tools/ci-matrix/manifest.yaml 与 .github/workflows/ci-kernel.yml
  # 的 kernel-build job：矩阵维度、排除项、格数、调度约束、超时预算与
  # 编译门禁 token 任一漂移即阻断，杜绝「清单写了 28 格、流水线只跑 20 格」。
  - id: OS-BUILD-CI-MATRIX
    name: CI 编译矩阵一致性
    severity: P0
    category: build
    authority: 70-build-system/03-ci-cd-pipeline.md §3（OS-STD-TOOL-161 / OS-STD-TEST-011）
    executor:
      argv: ["python3", "tools/ci-matrix/ci_matrix.py", "--check"]

  # ── BTF / eBPF 基线一致性（OS-KER-106 / OS-OBS-012）───────────────────
  - id: OS-BUILD-BTF
    name: BTF / eBPF 基线一致性
    severity: P0
    category: build
    authority: 90-observability/02-ebpf-probes.md（OS-KER-106 / OS-OBS-012）
    executor:
      argv: ["python3", "tools/btf-integration/btf_integration.py", "--check"]

  # ── Kbuild 版本注入一致性（OS-STD-049 / OS-BUILD-010）─────────────────
  # 受检对象为 kernel/Makefile.airymaxos（版本四元组）、kernel/Makefile
  # （include 指令与 filechk_version.h 注入宏）与
  # tools/kbuild-version/contract/version_h.airy.txt（契约快照）：任一漂移即
  # 阻断，杜绝「版本文件改了、顶层 Makefile 没接线」或「契约快照滞后」。
  - id: OS-BUILD-KBUILD-VERSION
    name: Kbuild 版本注入一致性
    severity: P0
    category: build
    authority: 70-build-system/01-kbuild-system.md §5/§5.2（OS-STD-049 / OS-BUILD-010）
    executor:
      argv: ["python3", "tools/kbuild-version/kbuild_version.py", "--check"]

  # ── 发布物料清单 ↔ release 流水线一致性（OS-BUILD-RELEASE）─────────────
  # 受检对象为 tools/release-engineering/manifest.yaml 与
  # .github/workflows/release.yml：正向要求每条 active 物料的 evidence 被
  # 流水线真实声明，反向要求流水线声明的每个产物 glob 均已登记，双向缺漏即
  # 阻断，杜绝「文档写了、流水线没产」与「流水线产了、清单没登记」的漂移。
  - id: OS-BUILD-RELEASE
    name: 发布物料清单一致性
    severity: P0
    category: build
    authority: 120-development-process/09-release-process.md §3
    executor:
      argv: ["python3", "tools/release-engineering/release_manifest.py", "--check"]
